<!-- POS System Page Component -->
<div id="pos" class="page">
    <div class="page-header">
        <h1>Point of Sale</h1>
    </div>
    <div class="pos-container">
        <div class="pos-products">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="productSearch" placeholder="Search spa services...">
            </div>
            <div class="product-categories">
                <button class="category-btn active" data-category="all">All Services</button>
                <button class="category-btn" data-category="massage">Massage</button>
                <button class="category-btn" data-category="facial">Facial</button>
                <button class="category-btn" data-category="body">Body Treatment</button>
                <button class="category-btn" data-category="nails">Nails</button>
            </div>
            <div class="products-grid" id="posProductsGrid"></div>
        </div>
        <div class="pos-cart">
            <div class="cart-header">
                <h3>Current Sale</h3>
                <div class="cart-actions">
                    <button class="btn-icon" id="clearCart" title="Clear Cart">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="cartSubtotal">₱0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (12%):</span>
                    <span id="cartTax">₱0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="cartTotal">₱0.00</span>
                </div>
            </div>
            <div class="cart-actions">
                <button class="btn btn-secondary btn-full mb-2" onclick="holdTransaction()">
                    <i class="fas fa-pause"></i>
                    Hold
                </button>
                <button class="btn btn-primary btn-full" onclick="proceedToCheckout()">
                    <i class="fas fa-credit-card"></i>
                    Checkout
                </button>
            </div>
        </div>
    </div>
</div>
