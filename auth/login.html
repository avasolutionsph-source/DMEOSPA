<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Ava Solutions</title>
    <meta name="description" content="Sign in to your Ava Solutions spa management dashboard">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../src/assets/icons/icon.svg">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../src/css/main.css">
    <link rel="stylesheet" href="../src/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <img src="../src/assets/icons/icon.svg" alt="Ava Solutions" style="width: 64px; height: 64px;">
                    <h1>Ava Solutions</h1>
                    <p>Sign in to your spa management dashboard</p>
                </div>
            </div>
            
            <form id="loginForm" class="auth-form" onsubmit="event.preventDefault(); handleLogin(); return false;">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" class="form-input" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" class="form-input" required placeholder="Enter your password">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span class="checkmark"></span>
                        Remember me on this device
                    </label>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <button type="button" onclick="testLogin()" class="btn btn-secondary btn-full" style="margin-top: 10px;">
                    🧪 Test Demo Login
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Create one here</a></p>
                <p><a href="../marketing-website/public/index.html">← Back to Home</a></p>
                <div class="demo-login">
                    <small class="text-muted">
                        <strong>Demo Login:</strong><br>
                        Email: demo@spa.com<br>
                        Password: demo123
                    </small>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../src/js/database.js"></script>
    <script src="../src/js/utils/unified-logger.js"></script>
    <script src="../src/js/utils/logger-helper.js"></script>
    <script src="../src/js/utils/notification-manager.js"></script>
    <script src="../src/js/utils/error-handler.js"></script>
    <script src="../src/js/auth.js"></script>
    
    <script>
        // Test login function
        function testLogin() {
            document.getElementById('loginEmail').value = 'demo@spa.com';
            document.getElementById('loginPassword').value = 'demo123';
            handleLogin();
        }
        
        // Handle login function
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            try {
                // Use the auth system from auth.js
                if (window.auth && window.auth.login) {
                    const result = await window.auth.login(email, password);
                    if (result.success) {
                        window.location.href = '../index.html';
                    }
                } else {
                    console.error('Auth system not loaded');
                }
            } catch (error) {
                console.error('Login error:', error);
            }
        }
    </script>
</body>
</html>
