<!DOCTYPE html>
<html>
<head>
    <title>Quick Employee Sync</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 40px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        button:hover { background: #5a67d8; }
        .log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Quick Employee Sync</h1>
        <p>This will sync John and Andrew to the backend immediately.</p>
        
        <button onclick="quickSync()">SYNC EMPLOYEES NOW</button>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `${new Date().toLocaleTimeString()} - ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function quickSync() {
            log('Starting quick sync...', 'info');
            
            // Get token from localStorage
            const token = localStorage.getItem('authToken') || 
                        localStorage.getItem('userToken') || 
                        sessionStorage.getItem('authToken');
            
            if (!token) {
                log('❌ No auth token found! Please login to PWA first.', 'error');
                return;
            }
            
            log('✅ Token found', 'success');
            
            // Define the employees to sync
            const employees = [
                {
                    firstName: 'John',
                    lastName: 'N/A',
                    email: 'j@gmail.com',
                    phone: '',
                    position: 'Senior Therapist',
                    role: 'senior_therapist',
                    commissionRate: 0,
                    dailyRate: 0,
                    monthlyRate: 0,
                    hourlyRate: 0
                },
                {
                    firstName: 'Andrew',
                    lastName: 'N/A',
                    email: 'A@gmail.com',
                    phone: '',
                    position: 'Manager',
                    role: 'manager',
                    commissionRate: 0,
                    dailyRate: 1.25,
                    monthlyRate: 0,
                    hourlyRate: 0
                }
            ];
            
            for (const emp of employees) {
                log(`Syncing ${emp.firstName}...`, 'info');
                
                // Try multiple endpoints
                const endpoints = [
                    'https://daetspa-backend.onrender.com/api/employees',
                    'https://daetspa-backend.onrender.com/api/business/employees',
                    'https://ava-pwa-backend.onrender.com/api/employees',
                    'https://ava-pwa-backend.onrender.com/api/business/employees'
                ];
                
                let synced = false;
                
                for (const endpoint of endpoints) {
                    try {
                        log(`Trying ${endpoint}...`, 'info');
                        
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(emp)
                        });
                        
                        if (response.ok) {
                            log(`✅ ${emp.firstName} synced successfully via ${endpoint}!`, 'success');
                            synced = true;
                            break;
                        } else {
                            const status = response.status;
                            const text = await response.text();
                            
                            if (status === 400 && text.includes('already exists')) {
                                log(`⚠️ ${emp.firstName} already exists`, 'info');
                                synced = true;
                                break;
                            } else {
                                log(`Failed: ${status} - ${text.substring(0, 100)}`, 'error');
                            }
                        }
                    } catch (error) {
                        log(`Network error: ${error.message}`, 'error');
                    }
                }
                
                if (!synced) {
                    log(`❌ Could not sync ${emp.firstName}`, 'error');
                }
            }
            
            log('🎉 Sync complete! Refresh your marketing website to see the employees.', 'success');
        }
        
        // Auto-run on load
        window.addEventListener('load', () => {
            log('Ready to sync. Click the button above.', 'info');
        });
    </script>
</body>
</html>
