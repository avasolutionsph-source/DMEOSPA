<!DOCTYPE html>
<html>
<head>
    <title>Test Attendance Data Protection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .warning { color: orange; font-weight: bold; }
        .info { color: blue; }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .test-result {
            border: 2px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .protected { background-color: #e8f5e9; }
        .vulnerable { background-color: #ffebee; }
    </style>
</head>
<body>
    <h1>Attendance Data Protection Test</h1>
    
    <div class="test-result">
        <h2>Step 1: Create Test Attendance Data</h2>
        <button onclick="createTestData()">Create Test Attendance Records</button>
        <div id="createResult"></div>
    </div>
    
    <div class="test-result">
        <h2>Step 2: Check Protection Status</h2>
        <button onclick="checkProtection()">Check If Attendance Is Protected</button>
        <div id="protectionResult"></div>
    </div>
    
    <div class="test-result">
        <h2>Step 3: Simulate Memory Cleanup</h2>
        <button onclick="simulateCleanup()">Simulate Emergency Cleanup (What Would Happen at 90% Memory)</button>
        <div id="cleanupResult"></div>
    </div>
    
    <div class="test-result">
        <h2>Step 4: Verify Data After Cleanup</h2>
        <button onclick="verifyData()">Check If Attendance Data Survived</button>
        <div id="verifyResult"></div>
    </div>

    <script>
        // Essential keys list from memory-manager.js
        const essentialKeys = [
            'userToken', 
            'userData', 
            'settings',
            'attendance_attendanceRecords',
            'attendance_allAttendanceRecords',
            'attendance_lastSyncDate',
            'attendance_pendingSync',
            'employees',
            'rooms',
            'giftCertificates',
            'customers',
            'inventory',
            'transactions'
        ];
        
        function createTestData() {
            const resultDiv = document.getElementById('createResult');
            
            // Create test attendance records
            const testRecords = [
                { id: 1, employee: 'Test Employee 1', date: '2025-09-15', checkIn: '09:00', checkOut: '18:00' },
                { id: 2, employee: 'Test Employee 2', date: '2025-09-15', checkIn: '08:30', checkOut: '17:30' }
            ];
            
            // Store in localStorage with attendance keys
            localStorage.setItem('attendance_attendanceRecords', JSON.stringify(testRecords));
            localStorage.setItem('attendance_allAttendanceRecords', JSON.stringify(testRecords));
            localStorage.setItem('attendance_lastSyncDate', new Date().toISOString());
            
            // Also create some non-essential test data
            localStorage.setItem('test_data_should_be_deleted', 'This should be deleted during cleanup');
            localStorage.setItem('temp_cache', 'Temporary cache data');
            
            resultDiv.innerHTML = `
                <p class="success">✓ Test attendance data created!</p>
                <p>Created keys:</p>
                <ul>
                    <li>attendance_attendanceRecords (Protected)</li>
                    <li>attendance_allAttendanceRecords (Protected)</li>
                    <li>attendance_lastSyncDate (Protected)</li>
                    <li>test_data_should_be_deleted (Not Protected)</li>
                    <li>temp_cache (Not Protected)</li>
                </ul>
            `;
        }
        
        function checkProtection() {
            const resultDiv = document.getElementById('protectionResult');
            
            let html = '<h3>Protection Analysis:</h3>';
            
            // Check each attendance key
            const attendanceKeys = [
                'attendance_attendanceRecords',
                'attendance_allAttendanceRecords',
                'attendance_lastSyncDate',
                'attendance_pendingSync'
            ];
            
            html += '<div class="protected"><h4>Protected Keys (Will NOT be deleted):</h4><ul>';
            attendanceKeys.forEach(key => {
                const isProtected = essentialKeys.includes(key);
                if (isProtected) {
                    const hasData = localStorage.getItem(key) !== null;
                    html += `<li class="success">${key}: ${isProtected ? '✓ PROTECTED' : '✗ NOT PROTECTED'} ${hasData ? '(Has Data)' : '(No Data)'}</li>`;
                }
            });
            html += '</ul></div>';
            
            // Check non-essential keys
            html += '<div class="vulnerable"><h4>Unprotected Keys (Will be deleted at 90% memory):</h4><ul>';
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!essentialKeys.includes(key) && !key.startsWith('test_')) {
                    html += `<li class="error">${key}: ✗ VULNERABLE TO DELETION</li>`;
                }
            }
            
            const testKeys = ['test_data_should_be_deleted', 'temp_cache'];
            testKeys.forEach(key => {
                if (localStorage.getItem(key)) {
                    html += `<li class="error">${key}: ✗ WILL BE DELETED</li>`;
                }
            });
            html += '</ul></div>';
            
            resultDiv.innerHTML = html;
        }
        
        function simulateCleanup() {
            const resultDiv = document.getElementById('cleanupResult');
            
            resultDiv.innerHTML = '<p class="info">Simulating memory cleanup at 90% usage...</p>';
            
            // Simulate what memory-manager.js does
            const keysToRemove = [];
            const keysBefore = [];
            const keysAfter = [];
            
            // Record keys before cleanup
            for (let i = 0; i < localStorage.length; i++) {
                keysBefore.push(localStorage.key(i));
            }
            
            // Find non-essential keys (this is what memory-manager.js does)
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!essentialKeys.includes(key)) {
                    keysToRemove.push(key);
                }
            }
            
            // Remove non-essential keys
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            // Record keys after cleanup
            for (let i = 0; i < localStorage.length; i++) {
                keysAfter.push(localStorage.key(i));
            }
            
            resultDiv.innerHTML = `
                <p class="warning">⚠️ Emergency cleanup simulated!</p>
                <p><strong>Keys before cleanup:</strong> ${keysBefore.length}</p>
                <ul>${keysBefore.map(k => `<li>${k}</li>`).join('')}</ul>
                <p><strong>Keys removed:</strong> ${keysToRemove.length}</p>
                <ul>${keysToRemove.map(k => `<li class="error">${k} - DELETED</li>`).join('')}</ul>
                <p><strong>Keys remaining:</strong> ${keysAfter.length}</p>
                <ul>${keysAfter.map(k => `<li class="success">${k} - PROTECTED</li>`).join('')}</ul>
            `;
        }
        
        function verifyData() {
            const resultDiv = document.getElementById('verifyResult');
            
            const attendanceRecords = localStorage.getItem('attendance_attendanceRecords');
            const allAttendanceRecords = localStorage.getItem('attendance_allAttendanceRecords');
            const lastSyncDate = localStorage.getItem('attendance_lastSyncDate');
            const testData = localStorage.getItem('test_data_should_be_deleted');
            const tempCache = localStorage.getItem('temp_cache');
            
            let html = '<h3>Data Verification Results:</h3>';
            
            if (attendanceRecords && allAttendanceRecords) {
                html += '<div class="protected">';
                html += '<p class="success">✅ ATTENDANCE DATA SURVIVED THE CLEANUP!</p>';
                html += '<p>Protected data still present:</p>';
                html += '<ul>';
                html += `<li>attendance_attendanceRecords: ${attendanceRecords ? '✓ Present' : '✗ Missing'}</li>`;
                html += `<li>attendance_allAttendanceRecords: ${allAttendanceRecords ? '✓ Present' : '✗ Missing'}</li>`;
                html += `<li>attendance_lastSyncDate: ${lastSyncDate ? '✓ Present' : '✗ Missing'}</li>`;
                html += '</ul>';
                html += '</div>';
            } else {
                html += '<div class="vulnerable">';
                html += '<p class="error">❌ ATTENDANCE DATA WAS DELETED!</p>';
                html += '<p>This should not happen with the fix applied.</p>';
                html += '</div>';
            }
            
            html += '<div style="margin-top: 10px;">';
            html += '<p>Non-essential data (should be deleted):</p>';
            html += '<ul>';
            html += `<li>test_data_should_be_deleted: ${testData ? '✗ Still Present (BAD)' : '✓ Deleted (GOOD)'}</li>`;
            html += `<li>temp_cache: ${tempCache ? '✗ Still Present (BAD)' : '✓ Deleted (GOOD)'}</li>`;
            html += '</ul>';
            html += '</div>';
            
            if (attendanceRecords) {
                try {
                    const records = JSON.parse(attendanceRecords);
                    html += '<h4>Attendance Records Content:</h4>';
                    html += '<pre>' + JSON.stringify(records, null, 2) + '</pre>';
                } catch (e) {
                    html += '<p class="error">Error parsing attendance records</p>';
                }
            }
            
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
