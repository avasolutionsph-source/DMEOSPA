<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava Solutions - Spa Management PWA</title>
    <meta name="description" content="Professional spa and wellness center management system">
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="icon" type="image/svg+xml" href="src/assets/icons/icon.svg">
    <link rel="alternate icon" href="src/assets/icons/icon.svg">
    <meta name="theme-color" content="#6366f1">
    
    <!-- Modular CSS Architecture -->
    <link rel="stylesheet" href="src/css/main.css?v=2025082401">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- App Container - Components will be loaded here -->
    <div class="app-container">
        <!-- Sidebar and Main Content will be loaded by component-loader.js -->
    </div>

    <!-- Loading Indicator -->
    <div id="appLoader" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner">
                <i class="fas fa-spa fa-spin"></i>
            </div>
            <h3>Loading Ava Solutions...</h3>
            <p>Preparing your spa management system</p>
        </div>
    </div>

    <!-- Component Loader - Loads all HTML components -->
    <script src="src/js/component-loader.js"></script>
    
    <!-- Core Application Scripts -->
    <script src="src/js/config-service.js"></script>
    <script src="src/js/database.js"></script>
    <script src="src/js/auth.js"></script>
    <script src="src/js/state-manager.js"></script>
    <script src="src/js/sync.js"></script>
    <script src="src/js/dashboard.js"></script>
    <script src="src/js/pos.js"></script>
    <script src="src/js/products.js"></script>
    <script src="src/js/inventory.js"></script>
    <script src="src/js/employees.js"></script>
    <script src="src/js/rooms.js"></script>
    <script src="src/js/gift-certificates.js"></script>
    <script src="src/js/chatbot.js"></script>
    <script src="src/js/settings.js"></script>
    <script src="src/js/app.js"></script>

    <!-- CRITICAL: Authentication Check Before Everything Else -->
    <script>
        // IMMEDIATE authentication guard - runs before any other scripts
        (function() {
            console.log('🛡️ PWA Authentication Guard: Checking access...');
            
            const userToken = localStorage.getItem('userToken') || localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            const userData = localStorage.getItem('userData') || localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            
            const hasValidAuth = !!(userToken && userData);
            
            if (!hasValidAuth) {
                console.log('🚫 PWA Authentication Guard: No valid authentication detected');
                console.log('🚫 Token exists:', !!userToken);
                console.log('🚫 User data exists:', !!userData);
                console.log('🔄 Redirecting to login page...');
                window.location.replace('login.html');
                return;
            }
            
            // Validate user data structure
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    if (!user.email || !user.id) {
                        console.log('🚫 PWA Authentication Guard: Invalid user data structure');
                        // Only clear auth-related data, not everything
                        localStorage.removeItem('userToken');
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userData');
                        localStorage.removeItem('currentUser');
                        localStorage.removeItem('isLoggedIn');
                        sessionStorage.removeItem('userToken');
                        sessionStorage.removeItem('authToken');
                        sessionStorage.removeItem('userData');
                        sessionStorage.removeItem('currentUser');
                        window.location.replace('login.html');
                        return;
                    }
                } catch (error) {
                    console.log('🚫 PWA Authentication Guard: Corrupted user data');
                    // Only clear auth-related data, not everything
                    localStorage.removeItem('userToken');
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userData');
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('isLoggedIn');
                    sessionStorage.removeItem('userToken');
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('userData');
                    sessionStorage.removeItem('currentUser');
                    window.location.replace('login.html');
                    return;
                }
            }
            
            console.log('✅ PWA Authentication Guard: Valid authentication confirmed, allowing access');
        })();
    </script>

    <!-- Initialize App After Components Load -->
    <script>
        // Hide loader when app is ready
        document.addEventListener('componentLoaded', (e) => {
            if (e.detail.componentName === 'dashboard') {
                const loader = document.getElementById('appLoader');
                if (loader) {
                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.remove(), 300);
                    }, 1000);
                }
            }
        });

        // Enhanced error handling for component loading
        window.addEventListener('error', (e) => {
            console.error('Application error:', e);
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            console.error('Unhandled promise rejection:', e);
        });
    </script>

    <style>
        /* Loading overlay styles */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite alternate;
        }

        .loading-content h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .loading-content p {
            font-size: 1rem;
            opacity: 0.9;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
    </style>
</body>
</html>
