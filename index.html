<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava Solutions - Spa Management PWA</title>
    <meta name="description" content="Professional spa and wellness center management system">
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="icon" type="image/svg+xml" href="src/assets/icons/icon.svg">
    <link rel="alternate icon" href="src/assets/icons/icon.svg">
    <meta name="theme-color" content="#6366f1">
    
    <!-- Modular CSS Architecture - Load in proper order -->
    <link rel="stylesheet" href="src/css/variables.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/base.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/layout.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/components.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/navigation.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/forms.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/buttons.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/dashboard.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/utilities.css?v=1.8.0">
    <link rel="stylesheet" href="src/css/main.css?v=1.8.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- App Container - Components will be loaded here -->
    <div class="app-container">
        <!-- Sidebar and Main Content will be loaded by component-loader.js -->
    </div>

    <!-- Loading Indicator -->
    <div id="appLoader" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner">
                <i class="fas fa-spa fa-spin"></i>
            </div>
            <h3>Loading Ava Solutions...</h3>
            <p>Preparing your spa management system</p>
        </div>
    </div>

    <!-- Component Loader - Loads all HTML components -->
    <script type="module" src="src/js/component-loader.js?v=1.8.0"></script>
    
    <!-- Core Application Scripts - Load as modules to fix import errors -->
    <script type="module" src="src/js/database.js?v=1.8.0"></script>
    <script type="module" src="src/js/token-manager.js?v=1.8.0"></script>
    <script type="module" src="src/js/config-service.js?v=1.8.0"></script>
    <script type="module" src="src/js/auth.js?v=1.8.0"></script>
    <script type="module" src="src/js/state-manager.js?v=1.8.0"></script>
    <script type="module" src="src/js/sync.js?v=1.8.0"></script>
    <script type="module" src="src/js/dashboard.js?v=1.8.0"></script>
    <script type="module" src="src/js/pos.js?v=1.8.0"></script>
    <script type="module" src="src/js/products.js?v=1.8.0"></script>
    <script type="module" src="src/js/inventory.js?v=1.8.0"></script>
    <script type="module" src="src/js/employees.js?v=1.8.0"></script>
    <script type="module" src="src/js/rooms.js?v=1.8.0"></script>
    <script type="module" src="src/js/gift-certificates.js?v=1.8.0"></script>
    <script type="module" src="src/js/chatbot.js?v=1.8.0"></script>
    <script type="module" src="src/js/settings.js?v=1.8.0"></script>
    <script type="module" src="src/js/app.js?v=1.8.0"></script>

    <!-- DEVELOPMENT CACHE REFRESH -->
    <script>
        // Only clear cache in development mode or when explicitly needed
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            console.log('🔄 Development mode: cache clearing enabled');
            if ('serviceWorker' in navigator) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                        console.log('🗑️ Dev: Cleared cache:', name);
                    }
                });
            }
        } else {
            console.log('✅ Production mode: preserving service worker cache');
        }
    </script>

    <!-- CRITICAL: Browser Extension Protection and Authentication Check -->
    <script>
        // Protect against browser extension interference
        (function() {
            // Override console methods temporarily to catch extension-related errors
            const originalError = console.error;
            console.error = function(...args) {
                const message = args.join(' ');
                if (message.includes('chunk-mgcl') || message.includes('all-frames-ui') || message.includes('@import')) {
                    console.log('🛡️ Blocked extension error:', message);
                    return;
                }
                return originalError.apply(console, args);
            };
            
            // Restore original after initial load
            setTimeout(() => {
                console.error = originalError;
            }, 10000);
        })();
        
        // DEFERRED authentication check - allow PWA to load first
        console.log('🛡️ PWA: Allowing app to load, will check authentication after initialization');
        
        window.checkAuthenticationAfterLoad = function() {
            console.log('🛡️ PWA Authentication Check: Verifying after load...');
            
            // Wait for auth system to be available
            if (!window.authSystem) {
                console.log('⏳ Auth system not ready, retrying...');
                setTimeout(() => window.checkAuthenticationAfterLoad(), 100);
                return;
            }
            
            const isAuthenticated = window.authSystem.isAuthenticated();
            const currentUser = window.authSystem.getCurrentUser();
            
            console.log('🔍 Auth state:', {
                isAuthenticated,
                hasUser: !!currentUser,
                hasToken: !!window.authSystem.getAuthToken()
            });
            
            if (!isAuthenticated) {
                console.log('🚫 PWA Authentication: No valid authentication detected');
                console.log('🔄 Redirecting to login page...');
                setTimeout(() => {
                    window.location.replace('login.html');
                }, 1000); // Give user time to see the PWA loaded
                return false;
            }
            
            console.log('✅ PWA Authentication: Valid authentication confirmed');
            return true;
        };
        
        // Check if CSS is loading
        setTimeout(() => {
            const testElement = document.createElement('div');
            testElement.className = 'app-container';
            testElement.style.position = 'absolute';
            testElement.style.visibility = 'hidden';
            document.body.appendChild(testElement);
            
            const styles = window.getComputedStyle(testElement);
            const hasCSS = styles.getPropertyValue('display') !== 'block' || 
                          styles.getPropertyValue('margin') !== '0px' ||
                          styles.getPropertyValue('padding') !== '0px';
                          
            if (!hasCSS) {
                console.error('❌ CSS may not be loading properly');
            } else {
                console.log('✅ CSS appears to be loading');
            }
            
            document.body.removeChild(testElement);
        }, 100);
    </script>

    <!-- Service Worker Registration -->
    <script>
        // Register Service Worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    console.log('🔧 Registering service worker...');
                    const registration = await navigator.serviceWorker.register('service-worker.js', {
                        scope: './'
                    });
                    
                    console.log('✅ Service Worker registered successfully:', registration.scope);
                    
                    // Handle service worker updates
                    registration.addEventListener('updatefound', () => {
                        const newWorker = registration.installing;
                        console.log('🔄 Service Worker update found');
                        
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('📥 New service worker ready - update available');
                                // You can add update notification here if needed
                            }
                        });
                    });
                    
                } catch (error) {
                    console.error('❌ Service Worker registration failed:', error);
                }
            });
        } else {
            console.log('⚠️ Service Worker not supported in this browser');
        }
    </script>

    <!-- Initialize App After Components Load -->
    <script>
        // Hide loader when app is ready
        let loaderHidden = false;
        
        function hideLoader() {
            if (loaderHidden) return;
            loaderHidden = true;
            
            const loader = document.getElementById('appLoader');
            if (loader) {
                console.log('🎯 Hiding app loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    if (loader.parentNode) {
                        loader.remove();
                        console.log('✅ App loader removed');
                    }
                }, 300);
            }
        }
        
        // Hide loader when dashboard component is loaded
        document.addEventListener('componentLoaded', (e) => {
            console.log('📦 Component loaded:', e.detail.componentName);
            if (e.detail.componentName === 'dashboard') {
                setTimeout(hideLoader, 1000);
            }
        });
        
        // Fallback: Hide loader after 5 seconds regardless
        setTimeout(() => {
            if (!loaderHidden) {
                console.log('⏰ Loader timeout - hiding loader as fallback');
                hideLoader();
            }
        }, 5000);
        
        // Additional fallback: Hide loader when main content is found
        const checkForContent = () => {
            const dashboard = document.getElementById('dashboard');
            const sidebar = document.querySelector('.sidebar');
            
            if (dashboard && sidebar) {
                console.log('🎯 Found dashboard and sidebar - hiding loader');
                setTimeout(hideLoader, 500);
            } else {
                setTimeout(checkForContent, 500);
            }
        };
        
        // Start checking after initial delay
        setTimeout(checkForContent, 2000);

        // Enhanced error handling for component loading
        window.addEventListener('error', (e) => {
            // Filter out extension-related errors
            if (e.filename && (e.filename.includes('chunk-mgcl') || e.filename.includes('all-frames-ui'))) {
                console.log('🛡️ Blocked extension error:', e.filename);
                e.preventDefault();
                return;
            }
            console.error('Application error:', e);
        });
        
        window.addEventListener('unhandledrejection', (e) => {
            console.error('Unhandled promise rejection:', e);
        });
    </script>

    <style>
        /* Loading overlay styles */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-spinner {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite alternate;
        }

        .loading-content h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .loading-content p {
            font-size: 1rem;
            opacity: 0.9;
        }

        @keyframes pulse {
            from { opacity: 1; }
            to { opacity: 0.5; }
        }
    </style>
</body>
</html>
