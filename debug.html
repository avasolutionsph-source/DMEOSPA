<!DOCTYPE html>
<html>
<head>
    <title>CSS Debug</title>
    <link rel="stylesheet" href="src/css/main.css">
    <style>
        /* Test if basic CSS works */
        .test-css {
            background: red;
            color: white;
            padding: 20px;
            margin: 20px;
        }
        
        /* Test CSS variables */
        .test-vars {
            background: var(--primary-color, blue);
            color: var(--white, white);
            padding: 20px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="test-css">Basic CSS test - should have red background</div>
    <div class="test-vars">CSS Variables test - should have primary color background</div>
    
    <div class="app-container">
        <div class="sidebar">
            <div class="logo">
                <span>Test Logo</span>
            </div>
            <nav class="nav-menu">
                <a class="nav-item active" href="#">Test Navigation</a>
            </nav>
        </div>
    </div>
    
    <script>
        console.log('Debug HTML loaded');
        
        // Check computed styles
        const testElement = document.querySelector('.test-vars');
        const computedStyle = getComputedStyle(testElement);
        console.log('CSS Variable test background:', computedStyle.backgroundColor);
        
        // Check if CSS custom properties are working
        const rootStyle = getComputedStyle(document.documentElement);
        console.log('--primary-color value:', rootStyle.getPropertyValue('--primary-color'));
        
        // Check if CSS files are loaded
        console.log('Number of stylesheets:', document.styleSheets.length);
        for (let i = 0; i < document.styleSheets.length; i++) {
            const sheet = document.styleSheets[i];
            console.log(`Stylesheet ${i}:`, sheet.href);
            try {
                console.log(`  - Rules count:`, sheet.cssRules ? sheet.cssRules.length : 'Cannot access');
            } catch (e) {
                console.log(`  - Error accessing rules:`, e.message);
            }
        }
    </script>
</body>
</html>
