<!DOCTYPE html>
<html>
<head>
    <title>Register Killer Service Worker</title>
</head>
<body>
    <h1>🔥 Registering Killer Service Worker</h1>
    <div id="status">Registering killer service worker...</div>
    
    <script>
        async function registerKiller() {
            const statusDiv = document.getElementById('status');
            
            if ('serviceWorker' in navigator) {
                try {
                    // Register the killer service worker
                    const registration = await navigator.serviceWorker.register('./kill-sw.js', {
                        scope: '/'
                    });
                    
                    statusDiv.innerHTML = '✅ Killer service worker registered!<br>Waiting for it to activate...';
                    
                    // Wait for it to activate
                    await new Promise((resolve) => {
                        if (registration.active) {
                            resolve();
                        } else {
                            registration.addEventListener('updatefound', () => {
                                const newWorker = registration.installing;
                                newWorker.addEventListener('statechange', () => {
                                    if (newWorker.state === 'activated') {
                                        resolve();
                                    }
                                });
                            });
                        }
                    });
                    
                    statusDiv.innerHTML += '<br>✅ Killer activated! Clearing everything...';
                    
                    // Wait a bit for the killer to do its work
                    setTimeout(async () => {
                        // Now unregister everything
                        const registrations = await navigator.serviceWorker.getRegistrations();
                        for (const reg of registrations) {
                            await reg.unregister();
                        }
                        
                        statusDiv.innerHTML += '<br>🎯 ALL SERVICE WORKERS KILLED!<br><strong>Now refresh localhost:3000</strong>';
                    }, 2000);
                    
                } catch (error) {
                    statusDiv.innerHTML = `❌ Error: ${error.message}`;
                }
            } else {
                statusDiv.innerHTML = '❌ Service workers not supported';
            }
        }
        
        registerKiller();
    </script>
</body>
</html>
