<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings - Ava Solutions</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f6f7fb; margin:0; }
    header { position:sticky; top:0; background:white; border-bottom:1px solid #e5e7eb; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:8px; font-weight:600; }
    .container { max-width: 1100px; margin: 18px auto; padding: 0 16px; }
    .card { background:white; border:1px solid #eef2f7; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,0.04); }
    .bookings-header { padding:18px 20px; display:flex; align-items:center; justify-content:space-between; }
    .filters { display:flex; gap:8px; align-items:center; }
    .filters select, .filters input { padding:8px 10px; border:1px solid #e5e7eb; border-radius:8px; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px 14px; border-bottom:1px solid #f1f5f9; text-align:left; font-size:14px; }
    th { background:#f8fafc; color:#334155; text-transform:uppercase; font-size:12px; letter-spacing:.04em; }
    .status { padding:4px 8px; border-radius:999px; font-size:12px; font-weight:600; }
    .status.pending { background:#fff7ed; color:#9a3412; }
    .status.accepted { background:#ecfeff; color:#155e75; }
    .status.completed { background:#ecfdf5; color:#065f46; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><i class="fas fa-calendar-check" style="color:#1E3A8A"></i> <span>Bookings</span></div>
    <a href="/business-dashboard" style="text-decoration:none; color:#334155">Back</a>
  </header>
  <main class="container">
    <div class="card">
      <div class="bookings-header">
        <div class="filters">
          <select id="statusFilter">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="accepted">Accepted</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <input type="date" id="sinceFilter" />
        </div>
        <button id="refreshBtn">Refresh</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date/Time</th>
            <th>Customer</th>
            <th>Service</th>
            <th>Therapist</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody>
      </table>
    </div>
  </main>
  <script>
    async function loadBookings(){
      const token = localStorage.getItem('userToken');
      const status = document.getElementById('statusFilter').value;
      const since = document.getElementById('sinceFilter').value;
      const params = new URLSearchParams();
      if(status) params.set('status', status);
      if(since) params.set('since', since);
      const rows = document.getElementById('rows');
      rows.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
      try {
        // Try marketing proxy to PWA first
        let r = await fetch('/api/bookings' + (params.toString()?'?'+params.toString():''), { headers: token?{ Authorization: 'Bearer '+token }:{} });
        let j; if (r.ok) { j = await r.json(); }
        // If proxy failed or returned non-JSON, try marketing DB fallback
        if (!j || !j.data) {
          const resp = await fetch('/api/business/bookings', { headers: token?{ Authorization: 'Bearer '+token }:{} });
          if (resp.ok) { j = await resp.json(); j = { data: j.bookings || [] }; }
        }
        const data = (j && j.data) ? j.data : [];
        if (!data.length) { rows.innerHTML = '<tr><td colspan="5">No bookings found</td></tr>'; return; }
        rows.innerHTML = data.map(b => `<tr>
            <td>${b.startTime ? new Date(b.startTime).toLocaleString() : ''}</td>
            <td>${b.customer?.name || ''} ${b.customer?.phone?('(' + b.customer.phone + ')'):''}</td>
            <td>${b.serviceName || ''}</td>
            <td>${b.employeeName || ''}</td>
            <td><span class="status ${b.status || 'pending'}">${(b.status||'pending').toUpperCase()}</span></td>
        </tr>`).join('');
      } catch (e){ rows.innerHTML = '<tr><td colspan="5">Failed to load</td></tr>'; }
    }
    document.getElementById('refreshBtn').onclick = loadBookings;
    document.getElementById('statusFilter').onchange = loadBookings;
    document.getElementById('sinceFilter').onchange = loadBookings;
    // Init
    loadBookings();
  </script>
</body>
</html>
