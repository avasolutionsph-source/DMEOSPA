<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Ava Solutions PWA</title>
    <meta name="description" content="Sign in to access your spa management system">
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="icon" type="image/svg+xml" href="src/assets/icons/icon.svg">
    <link rel="alternate icon" href="src/assets/icons/icon.svg">
    <meta name="theme-color" content="#6366f1">
    
    <!-- Login Page Styles -->
    <link rel="stylesheet" href="src/css/main.css?v=2025082401">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Login page specific styles */
        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .login-header .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }

        .login-header p {
            opacity: 0.9;
            margin: 0;
            font-size: 0.9rem;
        }

        .login-body {
            padding: 2rem 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            background: #f3f4f6;
            color: var(--text-primary);
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .login-footer p {
            margin: 0 0 1rem 0;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .demo-login {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }

        .demo-login small {
            color: #0369a1;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 10px;
                max-width: none;
            }
            
            .login-header {
                padding: 1.5rem 1rem;
            }
            
            .login-body {
                padding: 1.5rem 1rem;
            }
        }

        /* CSS Variables */
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
        }
    </style>
</head>
<body>
    <!-- Back to marketing website link -->
    <a href="https://ava-solutions-marketing.netlify.app" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Website
    </a>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-spa"></i>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to your spa management system</p>
        </div>
        
        <div class="login-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="Enter your email" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="Enter your password" autocomplete="current-password">
                </div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me on this device</label>
                </div>
                
                <button type="submit" id="loginBtn" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
                
            </form>
            
            <div class="login-footer">
                <p>Don't have an account? <a href="https://ava-solutions-marketing.netlify.app/signup.html">Create one here</a></p>
            </div>
        </div>
    </div>

    <!-- Core Scripts for login functionality -->
    <script src="src/js/config-service.js"></script>
    <script src="src/js/database.js"></script>
    <script type="module" src="src/js/auth.js"></script>

    <script>
        // Login page functionality
        class LoginPage {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.loginBtn = document.getElementById('loginBtn');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                
                this.setupEventListeners();
                this.checkExistingAuth();
            }

            setupEventListeners() {
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
            }

            async checkExistingAuth() {
                // Check if user is already logged in
                const token = localStorage.getItem('userToken') || localStorage.getItem('authToken');
                if (token) {
                    this.showSuccess('Already logged in. Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            }

            async handleLogin(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;
                
                if (!email || !password) {
                    this.showError('Please enter both email and password.');
                    return;
                }
                
                this.setLoading(true);
                this.hideMessages();
                
                try {
                    const response = await fetch('https://ava-pwa-backend.onrender.com/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Store authentication data using auth system
                        console.log('🔐 Login successful, storing auth data via auth system');
                        
                        // Wait for auth system to be available
                        const storeAuthData = () => {
                            if (window.authSystem) {
                                // Use auth system for proper backend integration
                                window.authSystem.authToken = data.token;
                                window.authSystem.currentUser = data.user;
                                window.authSystem.isLoggedIn = true;
                                
                                // Store in appropriate storage
                                const storage = rememberMe ? localStorage : sessionStorage;
                                storage.setItem('authToken', data.token);
                                storage.setItem('currentUser', JSON.stringify(data.user));
                                storage.setItem('isLoggedIn', 'true');
                                
                                console.log('✅ Auth data stored via auth system');
                            } else {
                                console.warn('⚠️ Auth system not available, using direct storage');
                                // Fallback to direct storage
                                const storage = rememberMe ? localStorage : sessionStorage;
                                storage.setItem('authToken', data.token);
                                storage.setItem('currentUser', JSON.stringify(data.user));
                                storage.setItem('isLoggedIn', 'true');
                            }
                        };
                        
                        // Try immediately, with fallback after delay
                        storeAuthData();
                        setTimeout(storeAuthData, 100);
                        
                        this.showSuccess('Login successful! Redirecting to dashboard...');
                        
                        // Redirect to PWA dashboard
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1500);
                    } else {
                        this.showError(data.error || 'Login failed. Please try again.');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    this.showError('Connection error. Please check your internet connection and try again.');
                }
                
                this.setLoading(false);
            }


            setLoading(loading) {
                if (loading) {
                    this.loginBtn.classList.add('loading');
                    this.loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
                    this.loginBtn.disabled = true;
                } else {
                    this.loginBtn.classList.remove('loading');
                    this.loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    this.loginBtn.disabled = false;
                }
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.style.display = 'block';
                this.successMessage.style.display = 'none';
            }

            showSuccess(message) {
                this.successMessage.textContent = message;
                this.successMessage.style.display = 'block';
                this.errorMessage.style.display = 'none';
            }

            hideMessages() {
                this.errorMessage.style.display = 'none';
                this.successMessage.style.display = 'none';
            }
        }

        // Initialize login page when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.loginPage = new LoginPage();
        });
    </script>
</body>
</html>
