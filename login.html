<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ava Solutions</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <meta name="theme-color" content="#6366f1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .login-form {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f8f9fa;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: #999;
        }
        
        .password-container {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: #667eea;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .remember-me input {
            margin-right: 8px;
        }
        
        .remember-me label {
            font-size: 14px;
            color: #666;
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: #f8f9fa;
            color: #333;
            border: 1px solid #e0e0e0;
        }
        
        .btn-secondary:hover {
            background: #e9ecef;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }
        
        .divider span {
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 13px;
            position: relative;
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .alert.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }
        
        .alert-success {
            background: #efe;
            color: #3a3;
            border: 1px solid #cfc;
        }
        
        .alert-info {
            background: #e6f3ff;
            color: #0066cc;
            border: 1px solid #b3d9ff;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .footer-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            transition: color 0.3s;
        }
        
        .footer-links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .login-container {
                max-width: 100%;
            }
            
            .login-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-spa"></i>
            </div>
            <h1>Ava Solutions</h1>
            <p>Business Management System</p>
        </div>
        
        <form class="login-form" id="loginForm">
            <div id="alertMessage" class="alert"></div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>
            
            <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div>
            
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span id="btnText">Login to Dashboard</span>
            </button>
            
            <div class="divider">
                <span>OR</span>
            </div>
            
            <button type="button" class="btn btn-secondary" id="demoBtn">
                <i class="fas fa-user-circle"></i> Login with Demo Account
            </button>
            
            <div class="loading" id="loadingSpinner">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #666;">Authenticating...</p>
            </div>
            
            <div class="footer-links">
                <a href="#" id="forgotPassword">Forgot Password?</a>
                <a href="#" id="needHelp">Need Help?</a>
            </div>
        </form>
    </div>
    
    <script>
        // Login functionality
        class LoginPage {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.emailInput = document.getElementById('email');
                this.passwordInput = document.getElementById('password');
                this.rememberCheckbox = document.getElementById('remember');
                this.loginBtn = document.getElementById('loginBtn');
                this.demoBtn = document.getElementById('demoBtn');
                this.alertDiv = document.getElementById('alertMessage');
                this.loadingDiv = document.getElementById('loadingSpinner');
                this.btnText = document.getElementById('btnText');
                this.togglePassword = document.getElementById('togglePassword');
                
                // PWA Backend URL
                this.apiUrl = 'https://ava-pwa-backend.onrender.com/api';
                
                this.init();
            }
            
            init() {
                // Check if already logged in
                this.checkExistingAuth();
                
                // Set up event listeners
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
                this.demoBtn.addEventListener('click', () => this.handleDemoLogin());
                this.togglePassword.addEventListener('click', () => this.togglePasswordVisibility());
                
                // Load remembered email
                const rememberedEmail = localStorage.getItem('rememberedEmail');
                if (rememberedEmail) {
                    this.emailInput.value = rememberedEmail;
                    this.rememberCheckbox.checked = true;
                }
                
                // Handle forgot password and help links
                document.getElementById('forgotPassword').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.showAlert('info', 'Please contact your administrator to reset your password.');
                });
                
                document.getElementById('needHelp').addEventListener('click', (e) => {
                    e.preventDefault();
                    this.showAlert('info', 'For support, please contact support@avasolutions.ph');
                });
            }
            
            checkExistingAuth() {
                const token = localStorage.getItem('auth_token') || 
                            localStorage.getItem('authToken') || 
                            localStorage.getItem('token');
                            
                if (token) {
                    // Already logged in, redirect based on role
                    const userData = localStorage.getItem('auth_user') || 
                                   localStorage.getItem('userData') || 
                                   localStorage.getItem('user');
                    
                    if (userData) {
                        try {
                            const user = JSON.parse(userData);
                            const userRole = user.role || 'employee';
                            const rolePages = {
                                'owner': 'owner.html',
                                'admin': 'admin.html',
                                'manager': 'manager.html',
                                'employee': 'employee.html',
                                'therapist': 'therapist.html',
                                'receptionist': 'receptionist.html',
                                'rider': 'employee.html',
                                'utility': 'employee.html'
                            };
                            const targetPage = rolePages[userRole] || 'employee.html';
                            window.location.href = targetPage;
                        } catch (e) {
                            window.location.href = 'employee.html';
                        }
                    } else {
                        window.location.href = 'employee.html';
                    }
                }
            }
            
            togglePasswordVisibility() {
                const type = this.passwordInput.type === 'password' ? 'text' : 'password';
                this.passwordInput.type = type;
                this.togglePassword.classList.toggle('fa-eye');
                this.togglePassword.classList.toggle('fa-eye-slash');
            }
            
            showAlert(type, message) {
                this.alertDiv.className = `alert alert-${type} show`;
                this.alertDiv.textContent = message;
                
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    this.alertDiv.classList.remove('show');
                }, 5000);
            }
            
            showLoading(show) {
                if (show) {
                    this.loadingDiv.classList.add('show');
                    this.loginBtn.disabled = true;
                    this.demoBtn.disabled = true;
                    this.btnText.textContent = 'Logging in...';
                } else {
                    this.loadingDiv.classList.remove('show');
                    this.loginBtn.disabled = false;
                    this.demoBtn.disabled = false;
                    this.btnText.textContent = 'Login to Dashboard';
                }
            }
            
            async handleLogin(e) {
                e.preventDefault();
                
                const email = this.emailInput.value.trim();
                const password = this.passwordInput.value;
                
                if (!email || !password) {
                    this.showAlert('error', 'Please enter both email and password');
                    return;
                }
                
                // Remember email if checked
                if (this.rememberCheckbox.checked) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }
                
                this.showLoading(true);
                
                try {
                    // Try PWA Backend first
                    const response = await fetch(`${this.apiUrl}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.token) {
                        this.handleSuccessfulLogin(data);
                    } else {
                        throw new Error(data.error || 'Login failed');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    
                    // Fallback: Accept any credentials for testing
                    console.log('Using fallback authentication');
                    this.handleFallbackLogin(email);
                }
            }
            
            handleDemoLogin() {
                this.emailInput.value = 'demo@spa.com';
                this.passwordInput.value = 'demo123';
                this.handleLogin(new Event('submit'));
            }
            
            handleFallbackLogin(email) {
                const fallbackToken = `login-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                const fallbackUser = {
                    id: `user-${email.split('@')[0]}`,
                    email: email,
                    firstName: email.split('@')[0],
                    lastName: 'User',
                    role: 'owner',
                    businessName: `${email.split('@')[0]} Business`,
                    businessType: 'spa'
                };
                
                this.handleSuccessfulLogin({
                    token: fallbackToken,
                    user: fallbackUser
                });
            }
            
            handleSuccessfulLogin(data) {
                // Store authentication in all formats
                const authKeys = {
                    'auth_token': data.token,
                    'auth_user': JSON.stringify(data.user),
                    'authToken': data.token,
                    'userData': JSON.stringify(data.user),
                    'token': data.token,
                    'user': JSON.stringify(data.user),
                    'currentUser': JSON.stringify(data.user),
                    'userToken': data.token,
                    'isLoggedIn': 'true'
                };
                
                // Store in localStorage
                Object.entries(authKeys).forEach(([key, value]) => {
                    localStorage.setItem(key, value);
                });
                
                // Also store in sessionStorage
                sessionStorage.setItem('auth_token', data.token);
                sessionStorage.setItem('auth_user', JSON.stringify(data.user));
                
                this.showAlert('success', 'Login successful! Redirecting to dashboard...');
                
                // Redirect based on user role
                setTimeout(() => {
                    const userRole = data.user.role || 'employee';
                    const rolePages = {
                        'owner': 'owner.html',
                        'admin': 'admin.html',
                        'manager': 'manager.html',
                        'employee': 'employee.html',
                        'therapist': 'therapist.html',
                        'receptionist': 'receptionist.html',
                        'rider': 'employee.html',
                        'utility': 'employee.html'
                    };
                    const targetPage = rolePages[userRole] || 'employee.html';
                    window.location.href = targetPage;
                }, 1000);
            }
        }
        
        // Initialize login page
        document.addEventListener('DOMContentLoaded', () => {
            new LoginPage();
        });
    </script>
</body>
</html>
