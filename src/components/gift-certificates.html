<!-- Gift Certificates Management Page Component -->
<div id="gift-certificates" class="page">
    <div class="page-header">
        <h1>Gift Certificates</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="showGiftCertificateModal()">
                <i class="fas fa-gift"></i> Create Certificate
            </button>
        </div>
    </div>
    
    <div class="gc-filters">
        <div class="filter-group">
            <input type="text" id="gcSearch" placeholder="Search certificates..." class="form-input">
        </div>
        <div class="filter-group">
            <select id="gcStatus" class="form-input">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="redeemed">Redeemed</option>
                <option value="expired">Expired</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="gcAmountFilter" class="form-input">
                <option value="">All Amounts</option>
                <option value="0-500">₱0 - ₱500</option>
                <option value="500-1000">₱500 - ₱1,000</option>
                <option value="1000-2000">₱1,000 - ₱2,000</option>
                <option value="2000+">₱2,000+</option>
            </select>
        </div>
    </div>
    
    <div class="gc-stats">
        <div class="stat-card">
            <div class="stat-icon green">
                <i class="fas fa-gift"></i>
            </div>
            <div class="stat-content">
                <h3>Active Certificates</h3>
                <p class="stat-value" id="activeCertificates">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="fas fa-peso-sign"></i>
            </div>
            <div class="stat-content">
                <h3>Total Value</h3>
                <p class="stat-value" id="totalGCValue">₱0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon purple">
                <i class="fas fa-chart-line"></i>
            </div>
            <div class="stat-content">
                <h3>This Month</h3>
                <p class="stat-value" id="monthlyGCsSold">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange">
                <i class="fas fa-clock"></i>
            </div>
            <div class="stat-content">
                <h3>Expiring Soon</h3>
                <p class="stat-value" id="expiringSoon">0</p>
            </div>
        </div>
    </div>
    
    <div class="gc-actions">
        <div class="action-group">
            <button class="btn btn-secondary" onclick="generateGCReport()">
                <i class="fas fa-file-download"></i> Generate Report
            </button>
            <button class="btn btn-secondary" onclick="bulkGCOperations()">
                <i class="fas fa-tasks"></i> Bulk Operations
            </button>
        </div>
    </div>
    
    <div class="gc-list" id="gcList">
        <!-- Gift certificate cards will be populated here -->
    </div>
    
    <div class="gc-pagination" id="gcPagination">
        <!-- Pagination will be populated here -->
    </div>
</div>
