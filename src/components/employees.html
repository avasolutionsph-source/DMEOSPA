<!-- Employee Management Page Component -->
<div id="employees" class="page">
    <div class="page-header">
        <h1>Employee Management</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="showEmployeeModal()">
                <i class="fas fa-user-plus"></i> Add Employee
            </button>
        </div>
    </div>
    
    <div class="employee-filters">
        <div class="filter-group">
            <input type="text" id="employeeSearch" placeholder="Search employees..." class="form-input">
        </div>
        <div class="filter-group">
            <select id="employeeRole" class="form-input">
                <option value="">All Roles</option>
                <option value="therapist">Therapist</option>
                <option value="receptionist">Receptionist</option>
                <option value="manager">Manager</option>
                <option value="staff">Staff</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="employeeStatus" class="form-input">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>
    </div>
    
    <div class="employee-stats">
        <div class="stat-card">
            <div class="stat-icon green">
                <i class="fas fa-user-check"></i>
            </div>
            <div class="stat-content">
                <h3>Active Employees</h3>
                <p class="stat-value" id="activeEmployees">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="fas fa-users"></i>
            </div>
            <div class="stat-content">
                <h3>Total Employees</h3>
                <p class="stat-value" id="totalEmployees">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon purple">
                <i class="fas fa-star"></i>
            </div>
            <div class="stat-content">
                <h3>Top Performer</h3>
                <p class="stat-value" id="topPerformer">-</p>
            </div>
        </div>
    </div>
    
    <div class="employee-list" id="employeeList">
        <!-- Employee cards will be populated here -->
    </div>
    
    <div class="employee-pagination" id="employeePagination">
        <!-- Pagination will be populated here -->
    </div>
</div>
