<!-- Spa Services Management Page Component -->
<div id="products" class="page">
    <div class="page-header">
        <h1>Spa Services</h1>
        <div class="header-actions">
            <button class="btn btn-primary" id="addProductBtn">
                <i class="fas fa-plus"></i> Add Service
            </button>
        </div>
    </div>
    
    <div class="services-stats">
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="fas fa-spa"></i>
            </div>
            <div class="stat-content">
                <h3>Total Services</h3>
                <p class="stat-value" id="totalServices">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green">
                <i class="fas fa-star"></i>
            </div>
            <div class="stat-content">
                <h3>Most Popular</h3>
                <p class="stat-value" id="popularService">-</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon purple">
                <i class="fas fa-peso-sign"></i>
            </div>
            <div class="stat-content">
                <h3>Avg. Price</h3>
                <p class="stat-value" id="avgServicePrice">₱0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange">
                <i class="fas fa-clock"></i>
            </div>
            <div class="stat-content">
                <h3>Avg. Duration</h3>
                <p class="stat-value" id="avgDuration">0 min</p>
            </div>
        </div>
    </div>
    
    <div class="services-filters">
        <div class="filter-group">
            <input type="text" id="serviceSearch" placeholder="Search services..." class="form-input">
        </div>
        <div class="filter-group">
            <select id="categoryFilter" class="form-input">
                <option value="">All Categories</option>
                <option value="massage">Massage</option>
                <option value="facial">Facial</option>
                <option value="body">Body Treatment</option>
                <option value="nails">Nails</option>
                <option value="wellness">Wellness</option>
                <option value="packages">Packages</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="durationFilter" class="form-input">
                <option value="">All Durations</option>
                <option value="short">Short (≤45 min)</option>
                <option value="medium">Medium (46-90 min)</option>
                <option value="long">Long (>90 min)</option>
            </select>
        </div>
    </div>
    
    <div class="products-table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Service Name</th>
                    <th>Duration</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Show in POS</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="productsTableBody">
                <!-- Service rows will be populated here -->
            </tbody>
        </table>
    </div>
    
    <div class="table-pagination" id="servicesPagination">
        <!-- Pagination will be populated here -->
    </div>
</div>
