<!-- Settings Page Component -->
<div id="settings" class="page">
    <div class="page-header">
        <h1>Settings</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="saveAllSettings()">
                <i class="fas fa-save"></i>
                Save All Changes
            </button>
        </div>
    </div>
    
    <div class="settings-container">
        <!-- Business Information -->
        <div class="settings-section">
            <h2>Business Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Business Name</label>
                    <input type="text" id="businessName" class="form-input" placeholder="Your Spa Name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="businessPhone" class="form-input" placeholder="+63 999 123 4567">
                </div>
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="businessAddress" class="form-input" rows="3" placeholder="Complete business address"></textarea>
            </div>
        </div>

        <!-- System Preferences -->
        <div class="settings-section">
            <h2>System Preferences</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Currency</label>
                    <select id="currency" class="form-input">
                        <option value="PHP">Philippine Peso (₱)</option>
                        <option value="USD">US Dollar ($)</option>
                        <option value="EUR">Euro (€)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Timezone</label>
                    <select id="timezone" class="form-input">
                        <option value="Asia/Manila">Asia/Manila (GMT+8)</option>
                        <option value="UTC">UTC (GMT+0)</option>
                    </select>
                </div>
            </div>
            <div class="form-check">
                <input type="checkbox" id="autoSync" class="form-check-input">
                <label for="autoSync" class="form-check-label">
                    Enable automatic data synchronization
                </label>
            </div>
            <div class="form-check">
                <input type="checkbox" id="notifications" class="form-check-input">
                <label for="notifications" class="form-check-label">
                    Enable push notifications
                </label>
            </div>
        </div>

        <!-- Receipt Settings -->
        <div class="settings-section">
            <h2>Receipt Settings</h2>
            <div class="form-group">
                <label>Receipt Header</label>
                <textarea id="receiptHeader" class="form-input" rows="3" placeholder="Text to appear at the top of receipts"></textarea>
            </div>
            <div class="form-group">
                <label>Receipt Footer</label>
                <textarea id="receiptFooter" class="form-input" rows="3" placeholder="Text to appear at the bottom of receipts"></textarea>
            </div>
            <div class="form-check">
                <input type="checkbox" id="printReceipts" class="form-check-input">
                <label for="printReceipts" class="form-check-label">
                    Automatically print receipts
                </label>
            </div>
        </div>

        <!-- Data Management -->
        <div class="settings-section">
            <h2>Data Management</h2>
            <div class="data-actions">
                <button class="btn btn-secondary" onclick="exportData()">
                    <i class="fas fa-download"></i>
                    Export Data
                </button>
                <button class="btn btn-secondary" onclick="importData()">
                    <i class="fas fa-upload"></i>
                    Import Data
                </button>
                <button class="btn btn-warning" onclick="clearCache()">
                    <i class="fas fa-broom"></i>
                    Clear Cache
                </button>
                <button class="btn btn-danger" onclick="resetApplication()">
                    <i class="fas fa-exclamation-triangle"></i>
                    Reset Application
                </button>
            </div>
        </div>
    </div>
</div>
