<!-- Inventory Management Page Component -->
<div id="inventory" class="page">
    <div class="page-header">
        <h1>Inventory Management</h1>
        <div class="header-actions">
            <button class="btn btn-primary" onclick="showInventoryModal()">
                <i class="fas fa-plus"></i> Add Item
            </button>
        </div>
    </div>
    
    <div class="inventory-filters">
        <div class="filter-group">
            <input type="text" id="inventorySearch" placeholder="Search inventory..." class="form-input">
        </div>
        <div class="filter-group">
            <select id="inventoryCategory" class="form-input">
                <option value="">All Categories</option>
                <option value="supplies">Supplies</option>
                <option value="equipment">Equipment</option>
                <option value="consumables">Consumables</option>
            </select>
        </div>
        <div class="filter-group">
            <select id="stockStatus" class="form-input">
                <option value="">All Stock</option>
                <option value="in-stock">In Stock</option>
                <option value="low-stock">Low Stock</option>
                <option value="out-of-stock">Out of Stock</option>
            </select>
        </div>
    </div>
    
    <div class="inventory-stats">
        <div class="stat-card">
            <div class="stat-icon orange">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="stat-content">
                <h3>Low Stock Items</h3>
                <p class="stat-value" id="lowStockItems">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon red">
                <i class="fas fa-times-circle"></i>
            </div>
            <div class="stat-content">
                <h3>Out of Stock</h3>
                <p class="stat-value" id="outOfStockItems">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue">
                <i class="fas fa-boxes"></i>
            </div>
            <div class="stat-content">
                <h3>Total Items</h3>
                <p class="stat-value" id="totalInventoryItems">0</p>
            </div>
        </div>
    </div>
    
    <div class="inventory-list" id="inventoryList">
        <!-- Inventory items will be populated here -->
    </div>
    
    <div class="inventory-pagination" id="inventoryPagination">
        <!-- Pagination will be populated here -->
    </div>
</div>
