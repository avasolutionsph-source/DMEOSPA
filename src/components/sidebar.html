    <div class="sidebar-bottom">
        <div class="connection-status online" id="connectionStatus">

                <i class="fas fa-sync-alt fa-spin" style="display: none;"></i>
            </div>
        </div>
        
        <div class="auth-indicator" id="authIndicator">
            <button id="showLoginBtn" class="btn btn-primary" style="cursor: pointer; z-index: 10; position: relative;">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <script>
                // Define login modal function immediately for button
                function showLoginModal() {
                    console.log('🔐 Login button clicked - Direct modal open');
                    const modal = document.getElementById('authModal');
                    if (modal) {
                        modal.style.display = 'flex';
                        modal.style.position = 'fixed';
                        modal.style.top = '0';
                        modal.style.left = '0';
                        modal.style.width = '100%';
                        modal.style.height = '100%';
                        modal.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
                        modal.style.zIndex = '9999';
                        modal.style.alignItems = 'center';
                        modal.style.justifyContent = 'center';
                        
                        // Make sure the modal content is visible
                        const modalContent = modal.querySelector('.modal-content');
                        if (modalContent) {
                            modalContent.style.display = 'block';
                        }
                        
                        // Show login form, hide register form
                        const authLoginForm = document.getElementById('authLoginForm');
                        const authRegisterForm = document.getElementById('authRegisterForm');
                        if (authLoginForm) authLoginForm.style.display = 'block';
                        if (authRegisterForm) authRegisterForm.style.display = 'none';
                        
                        setTimeout(() => {
                            const emailInput = document.getElementById('loginEmail');
                            if (emailInput) {
                                emailInput.focus();
                                emailInput.select();
                            }
                        }, 100);
                        
                        // Add close button handler
                        const closeBtn = modal.querySelector('.modal-close');
                        if (closeBtn) {
                            closeBtn.onclick = function() {
                                modal.style.display = 'none';
                            };
                        }
                        
                        // Click outside to close
                        modal.onclick = function(e) {
                            if (e.target === modal) {
                                modal.style.display = 'none';
                            }
                        };
                    } else {
                        console.error('Auth modal not found');
                    }
                    
                    // Prevent other handlers from interfering
                    return false;
                }
                
                // Override window.showLoginModal to use our version
                window.showLoginModal = showLoginModal;
                
                // Add click event listener when the element exists
                document.addEventListener('DOMContentLoaded', function() {
                    const loginBtn = document.getElementById('showLoginBtn');
                    if (loginBtn) {
                        loginBtn.addEventListener('click', function(e) {
                            e.preventDefault();
                            e.stopPropagation();
                            showLoginModal();
                            return false;
                        });
                    }
                });
            </script>
            <div id="userInfo" style="display: none;" class="user-info">
                <span id="userName">User</span>
                <button id="logoutBtn" class="btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
