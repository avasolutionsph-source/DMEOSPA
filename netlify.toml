[build]
  # Marketing website build settings  
  base = "marketing-website"
  command = "echo 'Static marketing website - no build needed'"
  publish = "public"
  
[build.environment]
  NODE_VERSION = "18"

# PWA specific settings
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Single Page Application routing for PWA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

