# Netlify configuration for marketing website

[build]
  # Tell Netlify this is the marketing website
  base = "marketing-website"
  
  # Serve static files from the public directory
  publish = "public"
  
  # No build command needed - just serve static HTML
  command = "echo 'No build needed for static site'"

# Redirect API calls to the backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://ava-marketing-backend.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify"}

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables are set in Netlify UI
# No need to specify them here