<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ava Booking</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
	<header>
		<div class="row">
			<div class="brand"><span class="dot"></span> Ava Booking</div>
			<div id="authArea">
				<button id="loginBtn" class="btn">Login</button>
				<a id="ownerBookingsLink" class="btn" style="display:none" href="#">Owner Bookings</a>
				<button id="logoutBtn" class="btn" style="display:none">Logout</button>
			</div>
		</div>
	</header>
	<main class="container">
		<!-- Embedded login modal for booking site -->
		<div id="loginModal" class="card" style="display:none; max-width:520px; margin:20px auto; padding:20px;">
			<div class="section-title"><h2>Login</h2><small class="sub">Sign in to manage bookings</small></div>
			<form id="loginForm">
				<label>Email<input id="loginEmail" type="email" class="form-input" required placeholder="you@email.com"/></label>
				<label>Password<input id="loginPass" type="password" class="form-input" required/></label>
				<div style="display:flex; gap:8px; margin-top:10px;">
					<button type="submit" class="btn primary">Sign In</button>
					<button type="button" id="closeLogin" class="btn secondary">Cancel</button>
				</div>
			</form>
		</div>
		<section id="businessSection" class="card">
			<div class="section-title"><h2>Choose a Spa</h2><small class="sub">Select a spa to book.</small></div>
			<div id="businessList" class="biz-list"></div>
			<p class="sub" id="businessHint" style="margin-top:8px">Tap a spa to continue.</p>
		</section>
	</main>
	<script src="/main.js"></script>
</body>
</html>
