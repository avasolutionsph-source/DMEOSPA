<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ava Booking</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
	<header>
		<div class="row">
			<div class="brand"><span class="dot"></span> Ava Booking</div>
			<div id="authArea">
				<button id="loginBtn" class="btn">Login</button>
				<button id="logoutBtn" class="btn" style="display:none">Logout</button>
			</div>
		</div>
	</header>
	<main class="container">
		<section id="businessSection" class="card">
			<div class="section-title"><h2>Choose a Spa</h2><small class="sub">Select a spa to view services.</small></div>
			<div id="businessList" class="biz-list"></div>
			<div id="businessChips" class="chips" style="display:none"></div>
			<p class="sub" id="businessHint" style="margin-top:8px">Select a spa to view services.</p>
		</section>

		<section id="storeSection" class="card" style="display:none">
			<div class="section-title"><h2>Select Store</h2></div>
			<select id="storeSelect"></select>
			<p class="sub">Choose outlet to see available services and therapists.</p>
		</section>

		<section class="card">
			<div class="section-title">
				<h2>Choose Service</h2>
				<small class="sub">Tap to select</small>
			</div>
			<div id="serviceChips" class="chips"></div>
			<div class="grid" style="margin-top:10px">
				<label>Service (full list)
					<select id="serviceSelect"></select>
				</label>
				<label>Duration (mins)
					<input type="number" id="durationInput" min="15" step="15" value="60">
				</label>
			</div>
		</section>

		<section class="card">
			<div class="section-title">
				<h2>Pick a Time</h2>
				<button id="checkAvailabilityBtn" class="btn secondary">Refresh</button>
			</div>
			<label>Date
				<input type="date" id="dateInput">
			</label>
			<div id="slotGrid" class="slot-grid"></div>
			<div id="availabilityResult" class="sub" style="margin-top:8px"></div>
		</section>

		<section class="card">
			<div class="section-title"><h2>Details</h2></div>
			<div class="grid">
				<label>Therapist (optional)
					<select id="employeeSelect"><option value="">Any available</option></select>
				</label>
				<label>Party Size
					<input type="number" id="partySizeInput" min="1" max="4" value="1">
				</label>
				<label>Customer Name
					<input type="text" id="customerName" placeholder="Full name" required>
				</label>
				<label>Phone
					<input type="tel" id="customerPhone" placeholder="09XXXXXXXXX" required>
				</label>
				<label>Email
					<input type="email" id="customerEmail" placeholder="you@email.com">
				</label>
				<label>Notes
					<input type="text" id="notes" placeholder="Preferences, requests...">
				</label>
			</div>
		</section>
	</main>
	<div class="bottom-bar">
		<div class="bottom-wrap">
			<div class="summary">
				<div class="main" id="summaryService">Select a service</div>
				<div id="summaryTime">No time selected</div>
			</div>
			<button id="submitBookingBtn" class="btn primary">Book Now</button>
		</div>
	</div>
	<script src="/main.js"></script>
</body>
</html>
