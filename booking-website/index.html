<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ava Booking - Find Your Perfect Spa</title>
	<link rel="stylesheet" href="/style.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		.hero {
			text-align: center;
			padding: 3rem 2rem;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			margin-bottom: 2rem;
		}
		.hero h1 {
			font-size: 2.5rem;
			margin-bottom: 1rem;
		}
		.hero p {
			font-size: 1.1rem;
			opacity: 0.9;
			max-width: 600px;
			margin: 0 auto;
		}
		.biz-card {
			display: flex;
			align-items: center;
			padding: 1rem;
			border: 1px solid #e0e0e0;
			border-radius: 8px;
			margin-bottom: 1rem;
			cursor: pointer;
			transition: all 0.2s;
			background: white;
		}
		.biz-card:hover {
			border-color: #667eea;
			box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
		}
		.biz-thumb {
			width: 50px;
			height: 50px;
			background: #667eea;
			color: white;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: bold;
			font-size: 1.2rem;
			margin-right: 1rem;
		}
		.biz-info {
			flex: 1;
		}
		.biz-name {
			font-weight: 600;
			font-size: 1.1rem;
			margin-bottom: 0.25rem;
		}
		.biz-meta {
			color: #666;
			font-size: 0.9rem;
		}
		.search-bar {
			margin: 2rem 0;
			text-align: center;
		}
		.search-bar input {
			width: 100%;
			max-width: 500px;
			padding: 1rem;
			border: 1px solid #ddd;
			border-radius: 8px;
			font-size: 1rem;
		}
	</style>
</head>
<body>
	<header>
		<div class="row">
			<div class="brand"><span class="dot"></span> Ava Booking</div>
			<div id="authArea">
				<a id="loginBtn" class="btn" href="/login.html" style="display: inline-block;">Login</a>
				<button id="logoutBtn" class="btn secondary" style="display: none;">Logout</button>
				<a id="ownerBookingsLink" href="/owner.html" class="btn secondary" style="display: none;">My Business</a>
			</div>
		</div>
	</header>
	
	<div class="hero">
		<h1>🌸 Find Your Perfect Spa</h1>
		<p>Discover and book appointments at the best spas and wellness centers. Relax, rejuvenate, and treat yourself to the care you deserve.</p>
	</div>
	
	<main class="container">
		<div class="search-bar">
			<input type="search" id="searchInput" placeholder="🔍 Search spas by name or location..." />
		</div>
		
		<section>
			<h2 style="margin-bottom: 1rem;">Available Spas & Wellness Centers</h2>
			<div id="businessList">
				<!-- Businesses will be loaded here by main.js -->
				<div style="text-align: center; padding: 2rem; color: #666;">
					<div style="font-size: 2rem; margin-bottom: 1rem;">⏳</div>
					<p>Loading spa businesses...</p>
				</div>
			</div>
		</section>
	</main>
	
	<script src="/main.js"></script>
</body>
</html>
