<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return to Main App - Ava Solutions</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 1rem;
        }
        .container {
            max-width: 500px;
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .btn {
            background: white;
            color: #667eea;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            margin: 0.5rem;
            cursor: pointer;
        }
        .btn:hover {
            background: #f8f9fa;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="icon">
            <i class="fas fa-arrow-left"></i>
        </div>
        <h1>Return to Main App</h1>
        <p>Your therapist session has ended. Click below to return to the main Ava Solutions application.</p>
        
        <div style="margin-top: 2rem;">
            <a href="/index.html" class="btn">
                <i class="fas fa-home"></i> Return to Main App
            </a>
            <button onclick="history.back()" class="btn">
                <i class="fas fa-arrow-left"></i> Go Back
            </button>
        </div>
        
        <p style="margin-top: 2rem; font-size: 0.9rem; opacity: 0.8;">
            You can bookmark this page to quickly access the therapist portal in the future.
        </p>
    </div>
    
    <script>
        // Auto-redirect after 5 seconds if no action
        setTimeout(() => {
            if (window.opener) {
                // If opened in popup, close it
                window.close();
            } else {
                // Otherwise redirect to main app
                window.location.href = '/index.html';
            }
        }, 10000);
    </script>
</body>
</html>
