<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Bookings - Ava Booking</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .toolbar { display:flex; gap:8px; align-items:center; justify-content:space-between; }
    .filters { display:flex; gap:8px; align-items:center; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px 12px; border-bottom:1px solid #eee; font-size:14px; }
    th { background:#f8fafc; text-transform:uppercase; font-size:12px; letter-spacing:.04em; color:#334155; }
    .status { padding:4px 8px; border-radius:999px; font-size:12px; font-weight:600; }
    .status.pending { background:#fff7ed; color:#9a3412; }
    .status.accepted { background:#ecfeff; color:#155e75; }
    .status.completed { background:#ecfdf5; color:#065f46; }
  </style>
  <script>
    (function(){
      const marketingApi = 'https://ava-marketing-api.onrender.com';
      const qs = s => document.querySelector(s);
      let apiHost = marketingApi;
      const apiBase = () => apiHost + '/api';
      const params = new URLSearchParams(location.search);
      const businessId = params.get('businessId') || localStorage.getItem('bookingBusinessId');
      if (businessId) localStorage.setItem('bookingBusinessId', businessId);

      function isHttps(url){ try { return typeof url==='string' && url.startsWith('https://'); } catch(_) { return false; } }
      async function fetchJSON(url, opts={}){
        const headers = { 'Content-Type':'application/json' };
        if (businessId) headers['x-user-id'] = businessId;
        const r = await fetch(url, { ...opts, headers });
        if (!r.ok) throw new Error(await r.text());
        const ct = r.headers.get('content-type')||'';
        return ct.includes('application/json') ? r.json() : { raw: await r.text() };
      }

      async function loadBookings(){
        const status = qs('#statusFilter').value;
        const since = qs('#sinceFilter').value;
        const rows = qs('#rows');
        rows.innerHTML = '<tr><td colspan="5">Loading...</td></tr>';
        const sp = new URLSearchParams(); if(status) sp.set('status',status); if(since) sp.set('since',since);
        try {
          apiHost = marketingApi;
          let j = await fetchJSON(`${apiBase()}/bookings${sp.toString()?`?${sp.toString()}`:''}`);
          let data = j.data || [];
          if (!data.length) {
            // Fallback: marketing DB
            const token = localStorage.getItem('authToken')||'';
            const r2 = await fetch(`${marketingApi}/api/business/bookings`, { headers: { 'Authorization': `Bearer ${token}` } });
            if (r2.ok) { const j2 = await r2.json(); data = j2.bookings || []; }
          }
          rows.innerHTML = data.map(b => `<tr>
            <td>${b.startTime ? new Date(b.startTime).toLocaleString() : ''}</td>
            <td>${b.customer?.name || ''}</td>
            <td>${b.serviceName || ''}</td>
            <td>${b.employeeName || ''}</td>
            <td><span class="status ${b.status||'pending'}">${(b.status||'pending').toUpperCase()}</span></td>
          </tr>`).join('');
          if (!data.length) rows.innerHTML = '<tr><td colspan="5">No bookings yet</td></tr>';
        } catch (e) {
          rows.innerHTML = '<tr><td colspan="5">Failed to load</td></tr>';
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        // Ensure businessId is available; try decoding token if missing
        if (!businessId) {
          try {
            const tok = localStorage.getItem('authToken');
            if (tok) {
              const payload = JSON.parse(atob(tok.split('.')[1]));
              if (payload && payload.userId) localStorage.setItem('bookingBusinessId', payload.userId);
            }
          } catch(_){}
        }
        qs('#refreshBtn').onclick = loadBookings;
        qs('#statusFilter').onchange = loadBookings;
        qs('#sinceFilter').onchange = loadBookings;
        loadBookings();
      });
    })();
  </script>
</head>
<body>
  <header>
    <div class="row">
      <div class="brand"><span class="dot"></span> Ava Booking • Owner</div>
      <a class="btn" href="/">Back</a>
    </div>
  </header>
  <main class="container">
    <section class="card">
      <div class="section-title toolbar">
        <h2>Bookings</h2>
        <div class="filters">
          <select id="statusFilter">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="accepted">Accepted</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <input type="date" id="sinceFilter" />
          <button id="refreshBtn" class="btn secondary">Refresh</button>
        </div>
      </div>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>Date/Time</th>
              <th>Customer</th>
              <th>Service</th>
              <th>Therapist</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="rows"><tr><td colspan="5">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
