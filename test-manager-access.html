<!DOCTYPE html>
<html>
<head>
    <title>Test Manager Access</title>
    <style>
        body { 
            font-family: Arial; 
            padding: 40px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #5a67d8; }
        .log {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .info { color: blue; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Test Manager Access</h1>
        <p>This tool tests if the manager account can access data properly.</p>
        
        <div>
            <button onclick="testAuth()">1. Test Authentication</button>
            <button onclick="testEmployees()">2. Test Employees Access</button>
            <button onclick="testProducts()">3. Test Products Access</button>
            <button onclick="testInventory()">4. Test Inventory Access</button>
            <button onclick="testAll()">Run All Tests</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>
        
        <div id="log" class="log"></div>
    </div>

    <script>
        function log(msg, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
            log('Log cleared', 'info');
        }

        async function testAuth() {
            log('=== Testing Authentication ===', 'info');
            
            const token = localStorage.getItem('authToken') || 
                        localStorage.getItem('userToken');
            
            if (!token) {
                log('❌ No auth token found! Please login first.', 'error');
                return null;
            }
            
            log('✅ Token found', 'success');
            
            // Decode JWT token (base64)
            try {
                const parts = token.split('.');
                const payload = JSON.parse(atob(parts[1]));
                log(`Token payload:`, 'info');
                log(JSON.stringify(payload, null, 2), 'info');
                
                log(`User ID: ${payload.id}`, 'info');
                log(`User Role: ${payload.role}`, 'info');
                log(`Token Type: ${payload.type || 'owner'}`, 'info');
                
                if (payload.type === 'employee') {
                    log(`Employee Token Detected`, 'warning');
                    log(`Branch Owner ID (userId): ${payload.userId}`, 'info');
                    log(`Employee ID: ${payload.employeeId}`, 'info');
                    log(`Branch ID: ${payload.branchId}`, 'info');
                }
                
                return token;
            } catch (error) {
                log(`Error decoding token: ${error.message}`, 'error');
                return token;
            }
        }

        async function makeRequest(endpoint, token) {
            const baseUrl = 'https://daetspa-backend.onrender.com';
            const url = `${baseUrl}${endpoint}`;
            
            log(`Making request to: ${url}`, 'info');
            
            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`Response status: ${response.status} ${response.statusText}`, 
                    response.ok ? 'success' : 'error');
                
                const data = await response.json();
                return { ok: response.ok, data };
            } catch (error) {
                log(`Request failed: ${error.message}`, 'error');
                return { ok: false, error: error.message };
            }
        }

        async function testEmployees() {
            log('=== Testing Employees Access ===', 'info');
            const token = await testAuth();
            if (!token) return;
            
            // Test both endpoints
            const endpoints = [
                '/api/employees',
                '/api/business/employees'
            ];
            
            for (const endpoint of endpoints) {
                log(`\nTesting ${endpoint}...`, 'info');
                const result = await makeRequest(endpoint, token);
                
                if (result.ok) {
                    const employees = result.data.data || result.data.employees || [];
                    log(`✅ Success! Found ${employees.length} employees`, 'success');
                    if (employees.length > 0) {
                        log(`Sample employee: ${employees[0].firstName} ${employees[0].lastName}`, 'info');
                    }
                } else {
                    log(`❌ Failed to access ${endpoint}`, 'error');
                    log(`Error: ${JSON.stringify(result.data || result.error)}`, 'error');
                }
            }
        }

        async function testProducts() {
            log('=== Testing Products Access ===', 'info');
            const token = await testAuth();
            if (!token) return;
            
            const result = await makeRequest('/api/products', token);
            
            if (result.ok) {
                const products = result.data.data || [];
                log(`✅ Success! Found ${products.length} products/services`, 'success');
                
                const services = products.filter(p => p.category !== 'product');
                const items = products.filter(p => p.category === 'product');
                
                log(`Services: ${services.length}`, 'info');
                log(`Products: ${items.length}`, 'info');
                
                if (products.length > 0) {
                    log(`Sample: ${products[0].name} - ₱${products[0].price}`, 'info');
                }
            } else {
                log(`❌ Failed to access products`, 'error');
                log(`Error: ${JSON.stringify(result.data || result.error)}`, 'error');
            }
        }

        async function testInventory() {
            log('=== Testing Inventory Access ===', 'info');
            const token = await testAuth();
            if (!token) return;
            
            const result = await makeRequest('/api/inventory', token);
            
            if (result.ok) {
                const items = result.data.data || [];
                log(`✅ Success! Found ${items.length} inventory items`, 'success');
                
                if (items.length > 0) {
                    log(`Sample: ${items[0].name} - Stock: ${items[0].currentStock}`, 'info');
                }
            } else {
                log(`❌ Failed to access inventory`, 'error');
                log(`Error: ${JSON.stringify(result.data || result.error)}`, 'error');
            }
        }

        async function testAll() {
            clearLog();
            await testAuth();
            log('', 'info');
            await testEmployees();
            log('', 'info');
            await testProducts();
            log('', 'info');
            await testInventory();
            log('\n=== All tests completed ===', 'success');
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            log('Ready. Click a button to test manager access.', 'info');
        });
    </script>
</body>
</html>
