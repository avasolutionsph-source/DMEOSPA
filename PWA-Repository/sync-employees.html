<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Sync Tool - Ava Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .status-box {
            background: #f7f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .status-box h3 {
            margin-bottom: 10px;
            color: #444;
        }
        
        .employee-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
        }
        
        .employee-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .employee-item:last-child {
            border-bottom: none;
        }
        
        .employee-info {
            flex: 1;
        }
        
        .employee-name {
            font-weight: 600;
            color: #333;
        }
        
        .employee-meta {
            color: #666;
            font-size: 14px;
            margin-top: 2px;
        }
        
        .sync-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .sync-status.local {
            background: #fff3cd;
            color: #856404;
        }
        
        .sync-status.synced {
            background: #d4edda;
            color: #155724;
        }
        
        .sync-status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }
        
        .log-output {
            background: #2d3436;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .log-entry {
            margin-bottom: 4px;
        }
        
        .log-entry.error {
            color: #ff6b6b;
        }
        
        .log-entry.success {
            color: #51cf66;
        }
        
        .log-entry.info {
            color: #339af0;
        }
        
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Employee Sync Tool</h1>
        <p class="subtitle">Force synchronization of local employees to backend server</p>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">0</div>
                <div class="stat-label">Total Employees</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="localCount">0</div>
                <div class="stat-label">Local Only</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="syncedCount">0</div>
                <div class="stat-label">Synced</div>
            </div>
        </div>
        
        <div class="status-box">
            <h3>📊 Employee Status</h3>
            <div class="employee-list" id="employeeList">
                <p style="color: #666;">Checking employees...</p>
            </div>
        </div>
        
        <div class="actions">
            <div>
                <button class="btn" id="syncBtn" onclick="syncAllEmployees()">
                    Sync All Local Employees
                </button>
                <button class="btn btn-secondary" onclick="checkEmployees()">
                    Refresh Status
                </button>
            </div>
        </div>
        
        <div class="log-output" id="logOutput" style="display: none;">
            <div class="log-entry info">🚀 Sync console ready...</div>
        </div>
    </div>
    
    <script>
        let employees = [];
        let localEmployees = [];
        
        // Log function
        function log(message, type = 'info') {
            const logOutput = document.getElementById('logOutput');
            logOutput.style.display = 'block';
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logOutput.appendChild(entry);
            logOutput.scrollTop = logOutput.scrollHeight;
        }
        
        // Get auth token
        function getAuthToken() {
            return localStorage.getItem('authToken') || 
                   localStorage.getItem('userToken') || 
                   sessionStorage.getItem('authToken');
        }
        
        // Get API base URL
        function getAPIBaseURL() {
            const isProduction = window.location.hostname !== 'localhost' && 
                               window.location.hostname !== '127.0.0.1';
            return isProduction 
                ? 'https://daetspa-backend.onrender.com'
                : 'http://localhost:4001';
        }
        
        // Open IndexedDB
        async function openDatabase() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('AvaBusinessDB', 13);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        
        // Get all employees from IndexedDB
        async function getLocalEmployees() {
            try {
                const db = await openDatabase();
                const transaction = db.transaction(['employees'], 'readonly');
                const store = transaction.objectStore('employees');
                const request = store.getAll();
                
                return new Promise((resolve, reject) => {
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                log('Failed to read IndexedDB: ' + error.message, 'error');
                return [];
            }
        }
        
        // Update employee in IndexedDB
        async function updateLocalEmployee(employee) {
            try {
                const db = await openDatabase();
                const transaction = db.transaction(['employees'], 'readwrite');
                const store = transaction.objectStore('employees');
                
                // Remove localOnly flag if synced
                if (employee.localOnly) {
                    delete employee.localOnly;
                }
                employee.syncStatus = 'synced';
                employee.lastSynced = new Date().toISOString();
                
                const request = store.put(employee);
                
                return new Promise((resolve, reject) => {
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            } catch (error) {
                log('Failed to update local employee: ' + error.message, 'error');
                return false;
            }
        }
        
        // Check employees
        async function checkEmployees() {
            log('Checking employee status...', 'info');
            
            try {
                // Get all local employees
                employees = await getLocalEmployees();
                localEmployees = employees.filter(emp => emp.localOnly === true);
                
                // Update stats
                document.getElementById('totalCount').textContent = employees.length;
                document.getElementById('localCount').textContent = localEmployees.length;
                document.getElementById('syncedCount').textContent = 
                    employees.filter(emp => !emp.localOnly).length;
                
                // Display employees
                const listContainer = document.getElementById('employeeList');
                
                if (employees.length === 0) {
                    listContainer.innerHTML = '<p style="color: #666;">No employees found in local database</p>';
                    document.getElementById('syncBtn').disabled = true;
                    return;
                }
                
                listContainer.innerHTML = '';
                employees.forEach(emp => {
                    const item = document.createElement('div');
                    item.className = 'employee-item';
                    
                    const info = document.createElement('div');
                    info.className = 'employee-info';
                    info.innerHTML = `
                        <div class="employee-name">${emp.name || 'Unknown'}</div>
                        <div class="employee-meta">
                            ${emp.position || 'No position'} | 
                            ${emp.email || 'No email'} |
                            ID: ${emp.id || emp._id || 'No ID'}
                        </div>
                    `;
                    
                    const status = document.createElement('span');
                    status.className = 'sync-status';
                    
                    if (emp.localOnly) {
                        status.className += ' local';
                        status.textContent = 'LOCAL ONLY';
                    } else if (emp.syncStatus === 'synced') {
                        status.className += ' synced';
                        status.textContent = 'SYNCED';
                    } else {
                        status.className += ' local';
                        status.textContent = 'PENDING';
                    }
                    
                    item.appendChild(info);
                    item.appendChild(status);
                    listContainer.appendChild(item);
                });
                
                // Enable/disable sync button
                document.getElementById('syncBtn').disabled = localEmployees.length === 0;
                
                if (localEmployees.length > 0) {
                    log(`Found ${localEmployees.length} local-only employees to sync`, 'info');
                } else {
                    log('All employees are already synced!', 'success');
                }
                
            } catch (error) {
                log('Error checking employees: ' + error.message, 'error');
            }
        }
        
        // Sync single employee
        async function syncEmployee(employee) {
            const token = getAuthToken();
            if (!token) {
                throw new Error('No authentication token found');
            }
            
            const baseURL = getAPIBaseURL();
            log(`Syncing ${employee.name} to ${baseURL}...`, 'info');
            
            // Prepare employee data
            const employeeData = {
                name: employee.name,
                email: employee.email,
                phone: employee.phone,
                position: employee.position,
                salary: employee.salary || 0,
                commissionRate: employee.commissionRate || 0,
                startDate: employee.startDate,
                status: employee.status || 'active'
            };
            
            // Try different endpoints
            const endpoints = [
                '/api/employees',
                '/api/business/employees'
            ];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${baseURL}${endpoint}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(employeeData)
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        log(`✅ ${employee.name} synced successfully via ${endpoint}`, 'success');
                        
                        // Update local record
                        await updateLocalEmployee(employee);
                        return result;
                    } else if (response.status === 409) {
                        // Employee might already exist
                        log(`⚠️ ${employee.name} may already exist on server`, 'info');
                        await updateLocalEmployee(employee);
                        return { exists: true };
                    }
                } catch (error) {
                    log(`Failed ${endpoint}: ${error.message}`, 'error');
                }
            }
            
            throw new Error('Failed to sync to any endpoint');
        }
        
        // Sync all local employees
        async function syncAllEmployees() {
            const syncBtn = document.getElementById('syncBtn');
            syncBtn.disabled = true;
            syncBtn.innerHTML = '<span class="loading"></span> Syncing...';
            
            log('Starting sync process...', 'info');
            
            if (!getAuthToken()) {
                log('❌ No authentication token found. Please login first.', 'error');
                syncBtn.disabled = false;
                syncBtn.textContent = 'Sync All Local Employees';
                return;
            }
            
            let successCount = 0;
            let errorCount = 0;
            
            for (const employee of localEmployees) {
                try {
                    await syncEmployee(employee);
                    successCount++;
                } catch (error) {
                    errorCount++;
                    log(`❌ Failed to sync ${employee.name}: ${error.message}`, 'error');
                }
                
                // Small delay between syncs
                await new Promise(resolve => setTimeout(resolve, 500));
            }
            
            log(`🎉 Sync complete! Success: ${successCount}, Errors: ${errorCount}`, 
                errorCount > 0 ? 'info' : 'success');
            
            // Refresh the list
            setTimeout(() => {
                checkEmployees();
                syncBtn.disabled = false;
                syncBtn.textContent = 'Sync All Local Employees';
            }, 1000);
        }
        
        // Initialize on load
        window.addEventListener('load', () => {
            checkEmployees();
            
            // Auto-refresh every 5 seconds
            setInterval(checkEmployees, 5000);
        });
    </script>
</body>
</html>
