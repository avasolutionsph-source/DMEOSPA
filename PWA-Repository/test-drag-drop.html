<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Services Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-results { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0; }
        .pass { color: green; }
        .fail { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Drag & Drop Services Implementation Test</h1>
    <div id="test-results" class="test-results">
        <h3>Test Results:</h3>
        <div id="results"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script>
        function addResult(message, type = 'info') {
            const resultsDiv = document.getElementById('results');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = message;
            resultsDiv.appendChild(p);
        }

        // Test 1: Check if SortableJS is loaded
        if (typeof Sortable !== 'undefined') {
            addResult('✅ SortableJS library loaded successfully', 'pass');
        } else {
            addResult('❌ SortableJS library not found', 'fail');
        }

        // Test 2: Check if we can create a basic sortable
        try {
            const testDiv = document.createElement('div');
            testDiv.innerHTML = '<div>Item 1</div><div>Item 2</div>';
            const sortable = Sortable.create(testDiv, {
                animation: 150
            });
            if (sortable) {
                addResult('✅ Sortable instance can be created', 'pass');
                sortable.destroy();
            }
        } catch (error) {
            addResult('❌ Failed to create sortable instance: ' + error.message, 'fail');
        }

        // Test 3: Check required CSS classes
        const requiredClasses = [
            'sortable-ghost',
            'sortable-chosen', 
            'sortable-drag',
            'drag-handle'
        ];

        // Create temporary elements to test CSS
        const testElement = document.createElement('div');
        testElement.style.position = 'absolute';
        testElement.style.top = '-9999px';
        document.body.appendChild(testElement);

        let cssTestsPassed = 0;
        requiredClasses.forEach(className => {
            testElement.className = className;
            const styles = window.getComputedStyle(testElement);
            // Just check if the class doesn't cause errors
            cssTestsPassed++;
        });

        if (cssTestsPassed === requiredClasses.length) {
            addResult('✅ CSS classes are properly defined', 'pass');
        } else {
            addResult('⚠️ Some CSS classes may be missing', 'fail');
        }

        document.body.removeChild(testElement);

        // Test 4: Check drag handle functionality
        const dragTestDiv = document.createElement('div');
        dragTestDiv.innerHTML = `
            <div style="padding: 10px; border: 1px solid #ccc; margin: 5px;">
                <span class="drag-handle" style="cursor: grab;">≡</span> Test Item 1
            </div>
            <div style="padding: 10px; border: 1px solid #ccc; margin: 5px;">
                <span class="drag-handle" style="cursor: grab;">≡</span> Test Item 2
            </div>
        `;
        
        try {
            const dragSortable = Sortable.create(dragTestDiv, {
                handle: '.drag-handle',
                animation: 150,
                onEnd: (evt) => {
                    addResult('✅ Drag and drop event triggered successfully', 'pass');
                }
            });
            
            if (dragSortable) {
                addResult('✅ Sortable with drag handle created successfully', 'pass');
                
                // Add test div to page for manual testing
                const testContainer = document.createElement('div');
                testContainer.innerHTML = '<h3>Manual Test Area (try dragging):</h3>';
                testContainer.appendChild(dragTestDiv);
                document.body.appendChild(testContainer);
            }
        } catch (error) {
            addResult('❌ Failed to create sortable with drag handle: ' + error.message, 'fail');
        }

        addResult('🔍 Test completed. Check the manual test area below to verify drag functionality.', 'info');
    </script>
</body>
</html>
