<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Senior Therapist Payroll Access</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .warning { color: orange; }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>Test Senior Therapist Payroll Access</h1>
    
    <div class="test-section">
        <h2>1. Current User Check</h2>
        <button onclick="checkCurrentUser()">Check Current User</button>
        <div id="userInfo"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Database Status</h2>
        <button onclick="checkDatabase()">Check Database</button>
        <div id="dbStatus"></div>
    </div>
    
    <div class="test-section">
        <h2>3. PayrollManager Status</h2>
        <button onclick="checkPayrollManager()">Check PayrollManager</button>
        <div id="payrollStatus"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Test Payroll Initialization</h2>
        <button onclick="testPayrollInit()">Initialize Payroll for Employee</button>
        <div id="initResult"></div>
    </div>
    
    <div class="test-section">
        <h2>5. Test Page Navigation</h2>
        <button onclick="testPageNavigation()">Test Navigate to Payroll</button>
        <div id="navResult"></div>
    </div>
    
    <div class="test-section">
        <h2>Console Log</h2>
        <pre id="consoleLog"></pre>
    </div>
    
    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const logs = [];
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logs.push({ type: 'log', message: args.join(' ') });
            updateConsoleLog();
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logs.push({ type: 'error', message: args.join(' ') });
            updateConsoleLog();
        };
        
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            logs.push({ type: 'warn', message: args.join(' ') });
            updateConsoleLog();
        };
        
        function updateConsoleLog() {
            const logDiv = document.getElementById('consoleLog');
            logDiv.innerHTML = logs.slice(-20).map(log => {
                const color = log.type === 'error' ? 'red' : log.type === 'warn' ? 'orange' : 'black';
                return `<span style="color: ${color}">[${log.type.toUpperCase()}] ${log.message}</span>`;
            }).join('\n');
        }
        
        async function checkCurrentUser() {
            const div = document.getElementById('userInfo');
            
            // Mock a Senior Therapist user for testing
            if (!window.authSystem) {
                window.authSystem = {
                    isAuthenticated: () => true,
                    currentUser: {
                        id: 'test-123',
                        email: 'senior.therapist@test.com',
                        firstName: 'Test',
                        lastName: 'Therapist',
                        type: 'employee',
                        role: 'senior_therapist',
                        position: 'Senior Therapist'
                    }
                };
                div.innerHTML = `
                    <p class="warning">Auth system not found, created mock user:</p>
                    <pre>${JSON.stringify(window.authSystem.currentUser, null, 2)}</pre>
                `;
            } else if (window.authSystem.currentUser) {
                const user = window.authSystem.currentUser;
                div.innerHTML = `
                    <p class="success">Current user found:</p>
                    <pre>${JSON.stringify(user, null, 2)}</pre>
                    <p class="info">Type: ${user.type}</p>
                    <p class="info">Role: ${user.role}</p>
                    <p class="info">Is Senior Therapist: ${user.role === 'senior_therapist' ? 'YES' : 'NO'}</p>
                `;
            } else {
                div.innerHTML = `<p class="error">No user logged in!</p>`;
            }
        }
        
        async function checkDatabase() {
            const div = document.getElementById('dbStatus');
            
            if (window.db) {
                const status = {
                    dbExists: !!window.db,
                    dbObject: !!window.db.db,
                    isOpen: window.db.isOpen,
                    isDatabaseReady: window.isDatabaseReady ? window.isDatabaseReady() : 'function not available'
                };
                
                try {
                    const stores = await window.db.getAllStoreNames();
                    status.stores = stores;
                    status.hasPayrollRequests = stores.includes('payrollRequests');
                } catch (e) {
                    status.error = e.message;
                }
                
                div.innerHTML = `
                    <p class="${status.dbObject ? 'success' : 'error'}">Database status:</p>
                    <pre>${JSON.stringify(status, null, 2)}</pre>
                `;
            } else {
                div.innerHTML = `<p class="error">Database not found!</p>`;
            }
        }
        
        async function checkPayrollManager() {
            const div = document.getElementById('payrollStatus');
            
            if (window.payrollManager) {
                const status = {
                    exists: true,
                    isInitialized: window.payrollManager.isInitialized,
                    hasEmployees: window.payrollManager.employees?.length || 0,
                    hasPayrollRecords: window.payrollManager.payrollRecords?.length || 0,
                    hasRequests: window.payrollManager.requests?.length || 0
                };
                
                div.innerHTML = `
                    <p class="success">PayrollManager found:</p>
                    <pre>${JSON.stringify(status, null, 2)}</pre>
                `;
            } else {
                div.innerHTML = `<p class="error">PayrollManager not found!</p>`;
            }
        }
        
        async function testPayrollInit() {
            const div = document.getElementById('initResult');
            
            if (!window.payrollManager) {
                // Try to create it
                if (typeof PayrollManager !== 'undefined') {
                    window.payrollManager = new PayrollManager();
                    div.innerHTML = `<p class="info">Created new PayrollManager instance</p>`;
                } else {
                    div.innerHTML = `<p class="error">PayrollManager class not found! Make sure payroll.js is loaded.</p>`;
                    return;
                }
            }
            
            try {
                div.innerHTML = `<p class="info">Initializing payroll...</p>`;
                
                // Ensure we have a user
                if (!window.authSystem || !window.authSystem.currentUser) {
                    checkCurrentUser(); // Create mock user
                }
                
                await window.payrollManager.init();
                
                div.innerHTML = `
                    <p class="success">Payroll initialized successfully!</p>
                    <p>Is Initialized: ${window.payrollManager.isInitialized}</p>
                    <p>Payroll Records: ${window.payrollManager.payrollRecords?.length || 0}</p>
                    <p>Requests: ${window.payrollManager.requests?.length || 0}</p>
                `;
            } catch (error) {
                div.innerHTML = `
                    <p class="error">Initialization failed:</p>
                    <pre>${error.message}\n${error.stack}</pre>
                `;
            }
        }
        
        async function testPageNavigation() {
            const div = document.getElementById('navResult');
            
            if (!window.app) {
                div.innerHTML = `<p class="error">App not found! This test should be run from the main application.</p>`;
                return;
            }
            
            try {
                // Simulate navigation to payroll
                console.log('Testing navigation to payroll page...');
                await window.app.showPage('payroll');
                
                // Check if redirected to payroll-requests
                const activePages = document.querySelectorAll('.page.active');
                const activePage = activePages[0];
                
                if (activePage && activePage.id === 'payroll-requests') {
                    div.innerHTML = `
                        <p class="success">Successfully redirected to payroll-requests!</p>
                        <p>Active page: ${activePage.id}</p>
                    `;
                } else if (activePage) {
                    div.innerHTML = `
                        <p class="warning">Active page: ${activePage.id} (expected: payroll-requests)</p>
                    `;
                } else {
                    div.innerHTML = `<p class="error">No active page found!</p>`;
                }
            } catch (error) {
                div.innerHTML = `
                    <p class="error">Navigation failed:</p>
                    <pre>${error.message}</pre>
                `;
            }
        }
        
        // Load required scripts
        const scripts = [
            'js/database.js',
            'js/api-config.js',
            'js/auth.js',
            'js/payroll.js'
        ];
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        // Load scripts sequentially
        (async function() {
            console.log('Loading required scripts...');
            for (const src of scripts) {
                try {
                    await loadScript(src);
                    console.log(`Loaded: ${src}`);
                } catch (e) {
                    console.error(`Failed to load: ${src}`);
                }
            }
            console.log('All scripts loaded. Ready for testing!');
        })();
    </script>
</body>
</html>
