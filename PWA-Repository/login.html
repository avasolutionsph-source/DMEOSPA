<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Daet Massage and Spa</title>
    <meta name="description" content="Sign in to Daet Massage and Spa management system">
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="alternate icon" href="icons/icon.svg">
    <meta name="theme-color" content="#6366f1">
    
    <!-- Login Page Styles -->
    <link rel="stylesheet" href="styles.css?v=2025082401">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Login page specific styles */
        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .login-header .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .login-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }

        .login-header p {
            opacity: 0.9;
            margin: 0;
            font-size: 0.9rem;
        }

        .login-body {
            padding: 2rem 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-container input[type="checkbox"] {
            width: auto;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            background: #f3f4f6;
            color: var(--text-primary);
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .login-footer p {
            margin: 0 0 1rem 0;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .demo-login {
            background: #f0f9ff;
            border: 1px solid #0ea5e9;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
        }

        .demo-login small {
            color: #0369a1;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 10px;
                max-width: none;
            }
            
            .login-header {
                padding: 1.5rem 1rem;
            }
            
            .login-body {
                padding: 1.5rem 1rem;
            }
        }

        /* CSS Variables - Daet Massage Brand Colors */
        :root {
            --primary-color: #8B1538; /* Daet maroon */
            --secondary-color: #a91d43; /* Lighter maroon */
            --accent-color: #d4af37; /* Gold accent */
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
        }
    </style>
</head>
<body>
    <!-- Back to marketing website link -->
    <a href="#" class="back-link" style="display: none;">
        <i class="fas fa-arrow-left"></i> Back to Website
    </a>

    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-spa"></i>
            </div>
            <h1>Daet Massage and Spa</h1>
            <p>Sign in to manage your spa</p>
        </div>
        
        <div class="login-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" required placeholder="Enter your email" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" required placeholder="Enter your password" autocomplete="current-password">
                </div>
                
                <!-- Employee checkbox hidden - auto-detection handles login routing -->
                <div class="checkbox-container" style="display: none;">
                    <input type="checkbox" id="employeeLogin" onchange="toggleEmployeeInfo()">
                    <label for="employeeLogin">I'm an employee</label>
                </div>
                
                <div id="employeeInfo" style="display: none;">
                    <small>Use the credentials provided by your branch owner.</small>
                </div>
                
                <div class="checkbox-container">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me on this device</label>
                </div>
                
                <button type="submit" id="loginBtn" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i>
                    Sign In
                </button>
                
            </form>
            
            <div class="login-footer">
                <p>Don't have an account? <a href="register.html">Create one here</a></p>
            </div>
        </div>
    </div>

    <!-- Core Scripts for login functionality -->
    <script src="js/config-service.js"></script>
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Initialize AuthSystem for login
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('Initializing login page...');
            
            // Create auth system if not exists
            if (!window.authSystem) {
                window.authSystem = new AuthSystem();
            }
            
            // Check if already logged in
            const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
            const user = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            
            // 🔍 DEBUG: Log exact auth state on login page
            console.log('🔍 [LOGIN-DEBUG] Current auth state on login.html:', {
                hasToken: !!token,
                tokenLength: token ? token.length : 0,
                tokenPreview: token ? token.substring(0, 20) + '...' : 'null',
                hasUser: !!user,
                userPreview: user ? user.substring(0, 50) + '...' : 'null',
                localStorage_authToken: !!localStorage.getItem('authToken'),
                localStorage_currentUser: !!localStorage.getItem('currentUser'),
                sessionStorage_authToken: !!sessionStorage.getItem('authToken'),
                sessionStorage_currentUser: !!sessionStorage.getItem('currentUser')
            });
            
            // Validate user data if present
            let userObj = null;
            if (user) {
                try {
                    userObj = JSON.parse(user);
                    console.log('🔍 [LOGIN-DEBUG] Parsed user object:', {
                        id: userObj.id,
                        email: userObj.email,
                        role: userObj.role,
                        type: userObj.type
                    });
                } catch (e) {
                    console.error('🔍 [LOGIN-DEBUG] Invalid user data - cannot parse JSON:', e);
                    userObj = null;
                }
            }
            
            // Only redirect if BOTH token and valid user exist
            if (token && user && userObj) {
                console.log('✅ [LOGIN-DEBUG] Valid auth state found - redirecting to app');
                showSuccess('Already logged in. Redirecting...');
                setTimeout(() => {
                    // Check if there's a page to return to
                    const returnTo = sessionStorage.getItem('returnToPage');
                    if (returnTo) {
                        sessionStorage.removeItem('returnToPage');
                        window.location.href = 'index.html' + returnTo;
                    } else {
                        // Get first allowed page for user's role
                        const firstAllowedPage = window.authSystem ?
                            window.authSystem.getFirstAllowedPage(userObj) :
                            (userObj.type === 'employee' ? 'attendance' : 'dashboard');
                        console.log('🔐 Already logged in, redirecting to first allowed page:', firstAllowedPage);
                        window.location.href = 'index.html#' + firstAllowedPage;
                    }
                }, 1500);
                return;
            } else {
                // Clear invalid auth state to prevent loops
                console.log('🔧 [LOGIN-DEBUG] Clearing invalid auth state:', {
                    reasonNoToken: !token,
                    reasonNoUser: !user,
                    reasonInvalidUser: !userObj
                });
                if (!token || !user || !userObj) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('currentUser');
                    sessionStorage.removeItem('authToken');
                    sessionStorage.removeItem('currentUser');
                }
            }
            
            // Setup login form
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // Create hidden fields for AuthSystem compatibility
                if (!document.getElementById('loginEmail')) {
                    const hiddenEmail = document.createElement('input');
                    hiddenEmail.type = 'hidden';
                    hiddenEmail.id = 'loginEmail';
                    document.body.appendChild(hiddenEmail);
                }
                if (!document.getElementById('loginPassword')) {
                    const hiddenPassword = document.createElement('input');
                    hiddenPassword.type = 'hidden';
                    hiddenPassword.id = 'loginPassword';
                    document.body.appendChild(hiddenPassword);
                }
                if (!document.getElementById('rememberMe')) {
                    const hiddenRemember = document.createElement('input');
                    hiddenRemember.type = 'hidden';
                    hiddenRemember.id = 'rememberMe';
                    document.body.appendChild(hiddenRemember);
                }
                
                // Map form fields to match what AuthSystem expects
                document.getElementById('loginEmail').value = document.getElementById('email').value;
                document.getElementById('loginPassword').value = document.getElementById('password').value;
                document.getElementById('rememberMe').checked = document.getElementById('rememberMe').checked;
                
                // Call AuthSystem's handleLogin
                await window.authSystem.handleLogin();
            });
        });
        
        // Helper functions for messages
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            if (errorDiv) {
                errorDiv.innerHTML = message;
                errorDiv.style.display = 'block';
            }
            const successDiv = document.getElementById('successMessage');
            if (successDiv) {
                successDiv.style.display = 'none';
            }
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            if (successDiv) {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
            }
            const errorDiv = document.getElementById('errorMessage');
            if (errorDiv) {
                errorDiv.style.display = 'none';
            }
        }
        
        function setButtonLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            
            if (loading) {
                btn.classList.add('loading');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                btn.disabled = false;
            }
        }
        
        // Make functions available globally for AuthSystem
        window.showError = showError;
        window.showSuccess = showSuccess;
        window.setButtonLoading = setButtonLoading;
    </script>
</body>
</html>
