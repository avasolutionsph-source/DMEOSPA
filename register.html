<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Ava Solutions PWA</title>
    <meta name="description" content="Create your account to access Ava Solutions spa management system">
    <link rel="manifest" href="manifest.json?v=2">
    <link rel="icon" type="image/svg+xml" href="src/assets/icons/icon.svg">
    <link rel="alternate icon" href="src/assets/icons/icon.svg">
    <meta name="theme-color" content="#6366f1">
    
    <!-- Register Page Styles -->
    <link rel="stylesheet" href="src/css/main.css?v=2025082401">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Register page specific styles */
        body {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .register-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            text-align: center;
            padding: 2rem 1.5rem;
        }

        .register-header .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .register-header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
        }

        .register-header p {
            opacity: 0.9;
            margin: 0;
            font-size: 0.9rem;
        }

        .register-body {
            padding: 2rem 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .register-footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .register-footer p {
            margin: 0;
            color: var(--text-secondary);
        }

        .register-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .register-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }

        .password-strength.weak {
            color: #dc2626;
        }

        .password-strength.medium {
            color: #f59e0b;
        }

        .password-strength.strong {
            color: #16a34a;
        }

        @media (max-width: 480px) {
            .register-container {
                margin: 10px;
                max-width: none;
            }
            
            .register-header {
                padding: 1.5rem 1rem;
            }
            
            .register-body {
                padding: 1.5rem 1rem;
            }
        }

        /* CSS Variables */
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
        }
    </style>
</head>
<body>
    <!-- Back to marketing website link -->
    <a href="https://ava-solutions-marketing.netlify.app" class="back-link">
        <i class="fas fa-arrow-left"></i> Back to Website
    </a>

    <div class="register-container">
        <div class="register-header">
            <div class="logo">
                <i class="fas fa-spa"></i>
            </div>
            <h1>Create Your Account</h1>
            <p>Start managing your spa business today</p>
        </div>
        
        <div class="register-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="businessName">Business Name *</label>
                    <input type="text" id="businessName" class="form-input" required placeholder="Your spa business name" autocomplete="organization">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" class="form-input" required placeholder="Your first name" autocomplete="given-name">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" class="form-input" required placeholder="Your last name" autocomplete="family-name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" class="form-input" required placeholder="your.email@example.com" autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" class="form-input" placeholder="+63 XXX XXX XXXX" autocomplete="tel">
                </div>
                
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" class="form-input" required placeholder="Create a strong password" autocomplete="new-password">
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" class="form-input" required placeholder="Confirm your password" autocomplete="new-password">
                </div>
                
                <button type="submit" id="registerBtn" class="btn-primary">
                    <i class="fas fa-user-plus"></i>
                    Create Account
                </button>
            </form>
            
            <div class="register-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </div>

    <!-- Core Scripts (removed auth.js due to module import issues) -->
    <script src="src/js/config-service.js"></script>
    <script src="src/js/database.js"></script>

    <script>
        // Register page functionality
        class RegisterPage {
            constructor() {
                this.form = document.getElementById('registerForm');
                this.registerBtn = document.getElementById('registerBtn');
                this.errorMessage = document.getElementById('errorMessage');
                this.successMessage = document.getElementById('successMessage');
                this.passwordInput = document.getElementById('password');
                this.passwordStrength = document.getElementById('passwordStrength');
                
                this.setupEventListeners();
                this.checkExistingAuth();
            }

            setupEventListeners() {
                this.form.addEventListener('submit', (e) => this.handleRegister(e));
                this.passwordInput.addEventListener('input', () => this.checkPasswordStrength());
                
                // Real-time validation for confirm password
                document.getElementById('confirmPassword').addEventListener('input', (e) => {
                    const password = document.getElementById('password').value;
                    const confirmPassword = e.target.value;
                    
                    if (confirmPassword && password !== confirmPassword) {
                        e.target.setCustomValidity('Passwords do not match');
                    } else {
                        e.target.setCustomValidity('');
                    }
                });
            }

            async checkExistingAuth() {
                // Check if user is already logged in
                const token = localStorage.getItem('userToken') || localStorage.getItem('authToken');
                if (token) {
                    this.showSuccess('Already logged in. Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                }
            }

            checkPasswordStrength() {
                const password = this.passwordInput.value;
                let strength = 0;
                let feedback = '';

                if (password.length >= 8) strength++;
                if (password.match(/[a-z]/)) strength++;
                if (password.match(/[A-Z]/)) strength++;
                if (password.match(/[0-9]/)) strength++;
                if (password.match(/[^a-zA-Z0-9]/)) strength++;

                if (password.length === 0) {
                    feedback = '';
                    this.passwordStrength.className = 'password-strength';
                } else if (strength <= 2) {
                    feedback = '❌ Weak password - Add uppercase, numbers, and symbols';
                    this.passwordStrength.className = 'password-strength weak';
                } else if (strength <= 3) {
                    feedback = '⚠️ Medium password - Consider adding more complexity';
                    this.passwordStrength.className = 'password-strength medium';
                } else {
                    feedback = '✅ Strong password';
                    this.passwordStrength.className = 'password-strength strong';
                }

                this.passwordStrength.textContent = feedback;
            }

            async handleRegister(e) {
                e.preventDefault();
                
                const formData = {
                    businessName: document.getElementById('businessName').value.trim(),
                    firstName: document.getElementById('firstName').value.trim(),
                    lastName: document.getElementById('lastName').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    password: document.getElementById('password').value,
                    confirmPassword: document.getElementById('confirmPassword').value
                };
                
                // Validate required fields
                if (!formData.businessName || !formData.firstName || !formData.lastName || !formData.email || !formData.password) {
                    this.showError('Please fill in all required fields.');
                    return;
                }
                
                // Validate email format
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(formData.email)) {
                    this.showError('Please enter a valid email address.');
                    return;
                }
                
                // Validate password strength
                if (formData.password.length < 6) {
                    this.showError('Password must be at least 6 characters long.');
                    return;
                }
                
                // Validate password match
                if (formData.password !== formData.confirmPassword) {
                    this.showError('Passwords do not match.');
                    return;
                }
                
                this.setLoading(true);
                this.hideMessages();
                
                try {
                    const response = await fetch('https://ava-pwa-backend.onrender.com/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            businessName: formData.businessName,
                            firstName: formData.firstName,
                            lastName: formData.lastName,
                            email: formData.email,
                            phone: formData.phone,
                            password: formData.password,
                            plan: 'basic' // Default plan
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        // Store authentication data
                        localStorage.setItem('userToken', data.token);
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('userData', JSON.stringify(data.user));
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                        localStorage.setItem('isLoggedIn', 'true');
                        
                        this.showSuccess('Account created successfully! Redirecting to dashboard...');
                        
                        // Redirect to PWA dashboard
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                    } else {
                        this.showError(data.error || 'Registration failed. Please try again.');
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    this.showError('Connection error. Please check your internet connection and try again.');
                }
                
                this.setLoading(false);
            }

            setLoading(loading) {
                if (loading) {
                    this.registerBtn.classList.add('loading');
                    this.registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
                    this.registerBtn.disabled = true;
                } else {
                    this.registerBtn.classList.remove('loading');
                    this.registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                    this.registerBtn.disabled = false;
                }
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.style.display = 'block';
                this.successMessage.style.display = 'none';
                
                // Scroll to top to show error
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            showSuccess(message) {
                this.successMessage.textContent = message;
                this.successMessage.style.display = 'block';
                this.errorMessage.style.display = 'none';
                
                // Scroll to top to show success
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            hideMessages() {
                this.errorMessage.style.display = 'none';
                this.successMessage.style.display = 'none';
            }
        }

        // Initialize register page when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.registerPage = new RegisterPage();
        });
    </script>
</body>
</html>
