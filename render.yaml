services:
  # Single Unified Backend
  - type: web
    name: ava-pwa-backend
    env: node
    region: singapore
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: ava-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 999y
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://ava-solutions-pwa.netlify.app,https://ava-solutions-marketing.netlify.app

databases:
  - name: ava-mongodb
    databaseName: avasolutions
    user: avasolutionsph