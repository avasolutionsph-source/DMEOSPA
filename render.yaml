services:
  # Marketing Website Backend API
  - type: web
    name: ava-marketing-backend
    env: node
    region: singapore
    buildCommand: cd marketing-website && npm install
    startCommand: cd marketing-website && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: ava-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: SUPER_ADMIN_EMAIL
        value: avasolutionsph@gmail.com
      - key: SUPER_ADMIN_PASSWORD
        value: Ava12345
      - key: ALLOWED_ORIGINS
        value: https://ava-solutions-marketing.netlify.app,https://ava-solutions-pwa.netlify.app

  # PWA Backend API (if needed)
  - type: web
    name: ava-pwa-backend  
    env: node
    region: singapore
    buildCommand: cd unified-backend && npm install
    startCommand: cd unified-backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10001
      - key: MONGODB_URI
        fromDatabase:
          name: ava-mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d

databases:
  - name: ava-mongodb
    databaseName: avasolutions
    user: avasolutionsph